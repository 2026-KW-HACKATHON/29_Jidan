x-api: &api
  image: ${BACKEND_IMAGE:?backend digest required}
  restart: unless-stopped
  env_file:
    - path: runtime.env
      format: raw
  volumes: [media:/var/lib/jidan/media]
  depends_on:
    mysql: {condition: service_healthy}
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  mysql:
    image: mysql@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    env_file:
      - path: mysql.env
        format: raw
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 60
  frontend:
    image: ${FRONTEND_IMAGE:?frontend digest required}
    restart: unless-stopped
    ports: ['127.0.0.1:3044:8080']
    security_opt: [no-new-privileges:true]
  worker:
    <<: *api
    ports: ['127.0.0.1:3045:8000']
    environment:
      DEMO_ROLE: WORKER
      DEMO_HOST: jidan-ilban-demo.leehyowon14.dev
      ALLOWED_ORIGINS: https://jidan-ilban-demo.leehyowon14.dev
      FORWARDED_ALLOW_IPS: '*'
  owner:
    <<: *api
    ports: ['127.0.0.1:3046:8000']
    environment:
      DEMO_ROLE: OWNER
      DEMO_HOST: jidan-jumju-demo.leehyowon14.dev
      ALLOWED_ORIGINS: https://jidan-jumju-demo.leehyowon14.dev
      FORWARDED_ALLOW_IPS: '*'
  retention:
    <<: *api
    environment:
      DEMO_ROLE: OWNER
      BACKGROUND_JOBS: 'off'
    command: [sh, -ec, 'while true; do python -m app.demo_retention; touch /tmp/demo-retention-ok; sleep 300; done']
    healthcheck:
      test: [CMD, python, -c, 'from pathlib import Path; import time; p=Path("/tmp/demo-retention-ok"); exit(0 if p.exists() and time.time()-p.stat().st_mtime < 600 else 1)']
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
  proxy:
    image: nginxinc/nginx-unprivileged@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
    restart: unless-stopped
    ports: ['100.78.68.53:80:8080']
    volumes: ['./proxy.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      frontend: {condition: service_healthy}
      worker: {condition: service_healthy}
      owner: {condition: service_healthy}
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
volumes:
  mysql: {name: jidan-demo-mysql}
  media: {name: jidan-demo-media}
