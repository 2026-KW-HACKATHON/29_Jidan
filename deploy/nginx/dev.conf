server {
    listen 80;
    listen [::]:80;
    server_name dev-jidan.leehyowon14.dev;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Google callback query contains one-use credentials; exclude both request logs.
    location = /api/auth/google/callback {
        access_log off;
        error_log /dev/null crit;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3021;
    }

    location = /api {
        proxy_pass http://127.0.0.1:3021;
    }
    location /api/ {
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3021;
    }
    # Manual/Q&A media uploads: 20 MiB recordings plus multipart framing. The app enforces the
    # exact per-purpose limits (photo 10 MiB, audio 20 MiB) and answers 413 itself.
    location ~ ^/api/stores/[^/]+/manual(/qa)?/media$ {
        client_max_body_size 21m;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3021;
    }
    location / {
        proxy_pass http://127.0.0.1:3020;
    }
}
