# Local fixtures only: fixed credentials have no access to dev/production databases.
x-build: &build
  context: ..
  dockerfile: testing/Dockerfile
x-db: &db
  image: mysql:8.4
  environment:
    MYSQL_ROOT_PASSWORD: sandbox-root
    MYSQL_DATABASE: jidan_sandbox
    MYSQL_USER: jidan
    MYSQL_PASSWORD: sandbox-only
  healthcheck:
    test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e "SELECT 1"']
    interval: 2s
    timeout: 3s
    retries: 60
  networks: [isolated]
x-env: &env
  APP_ENV: local
  COOKIE_SECURE: 'false'
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_NAME: jidan_sandbox
  DB_USER: jidan
  DB_PASSWORD: sandbox-only
  ALLOWED_ORIGINS: 'http://127.0.0.1:${JIDAN_SANDBOX_PORT:-18000}'
x-api: &api
  build: *build
  command: [sh, -c, 'python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000']
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 60
  networks: [isolated]
services:
  mysql:
    <<: *db
    profiles: [manual]
    volumes: [sandbox-data:/var/lib/mysql]
  api:
    <<: *api
    profiles: [manual]
    command: [sh, -c, 'python -m alembic upgrade head && exec python -m uvicorn testing.sandbox:create_app --factory --host 0.0.0.0 --port 8000']
    environment: *env
    depends_on:
      mysql: {condition: service_healthy}
    ports: ['127.0.0.1:${JIDAN_SANDBOX_PORT:-18000}:8000']
  e2e-mysql:
    <<: *db
    profiles: [e2e]
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root
      MYSQL_DATABASE: jidan_e2e_test
      MYSQL_USER: jidan
      MYSQL_PASSWORD: sandbox-only
    tmpfs: [/var/lib/mysql]
  e2e-api:
    <<: *api
    profiles: [e2e]
    environment: &e2e-env
      <<: *env
      DB_HOST: e2e-mysql
      DB_NAME: jidan_e2e_test
      ALLOWED_ORIGINS: http://e2e-api:8000
    depends_on:
      e2e-mysql: {condition: service_healthy}
  e2e:
    build: *build
    profiles: [e2e]
    environment:
      <<: *e2e-env
      JIDAN_REQUIRE_MYSQL: '1'
      JIDAN_E2E_BASE_URL: http://e2e-api:8000
    volumes: ['${JIDAN_E2E_REPORT_DIR:-../../.local/test-results}:/results']
    command: [sh, -c, 'python -m ruff check . && python -m pytest testing -q --junitxml=/results/tooling.xml && python -m testing.check_results /results/tooling.xml && python -m pytest -m mysql tests -q -rs --junitxml=/results/mysql.xml && python -m testing.check_results /results/mysql.xml && python -m pytest e2e -q --junitxml=/results/http-e2e.xml && python -m testing.check_results /results/http-e2e.xml']
    depends_on:
      e2e-api: {condition: service_healthy}
    networks: [isolated]
networks:
  isolated: {}
volumes:
  sandbox-data: {}
