  /api/store-invitations/accept:
    post:
      tags:
      - 근무자 초대
      operationId: acceptStoreInvitation
      summary: 초대 수락 및 매장 자료 접근 부여
      description: |-
        **수락자 인증**

        - 가입 완료된 ACTIVE `WORKER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - Google 로그인/가입 후에도 프론트에서 링크 문맥을 이어갈 수 있지만 가입 세션 자체로는 확인/수락/거절할 수 없습니다.
        - 요청 body에는 원문 `token`만 받습니다. 이메일·workerId·storeId·역할·접근 기간을 클라이언트가 지정하지 않습니다.
        - 서버가 토큰을 hash로 조회한 뒤 세션의 검증된 Google 이메일과 초대 이메일을 정규화해 비교합니다. 불일치는 **403 INVITATION_EMAIL_MISMATCH**이며 매장/초대 정보를 반환하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다. 없는/재전송으로 교체된 토큰은 **404 INVITATION_NOT_FOUND**입니다.
        - 토큰 조회 후에도 현재 매장 APPROVED 상태와 유효한 소유자를 확인합니다. 운영이 중지되었으면 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 초대 링크 만료는 **410 INVITATION_EXPIRED**, 지정 접근 기간 종료는 **410 ACCESS_PERIOD_ENDED**입니다. 종료 시각과 동일한 순간에도 사용할 수 없습니다.
        - token은 body로만 제출하며 응답·URL query·로그·오류·분석에서 제외합니다. 응답은 `Cache-Control: no-store`입니다.

        **수락과 자료 접근**

        - 유효 PENDING을 ACCEPTED로 전환하고 세션의 `workerId`·서버 수락 시각을 기록합니다. 초대 전이와 REGULAR 접근 권한을 같은 트랜잭션으로 생성합니다.
        - `startedAt`은 수락 시각이며 `validUntil`은 초대의 `accessExpiresAt`을 그대로 사용합니다. null이면 점주가 종료하기 전까지입니다.
        - 수락한 근무자에게 해당 매장의 업무 매뉴얼·체크리스트·AI 질의응답 접근을 함께 허용합니다. 실제 자료 API는 후속 범위입니다.
        - 이미 다른 유효 접근이 있으면 **409 WORKER_ALREADY_HAS_ACCESS**입니다. 같은 초대의 재수락으로 중복 권한을 만들지 않습니다.
        - 같은 세션 근무자가 이미 수락한 초대이고 링크/접근 기한이 남아 있으며 원래 권한도 유효하면 **200**으로 현재 권한을 반환합니다. 최초 startedAt/validUntil을 변경하지 않습니다.
        - 수락했던 접근이 점주에 의해 종료되었으면 **409**입니다. 다른 근무자가 수락했거나 거절/취소한 초대도 **409**이며 기존 권한을 복구하지 않습니다.
        - 종료 시각에 도달한 링크/접근의 재요청은 **410**입니다. 초대 레코드의 ACCEPTED 상태는 유지합니다.
        - 수락/취소/거절/재전송/접근 종료 경쟁과 중복 수락은 토큰·초대·매장/근무자 접근 단위의 잠금 또는 조건부 갱신으로 처리합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
