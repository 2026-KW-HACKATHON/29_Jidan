  /api/stores/{storeId}/manual/interviews/{sessionId}/intents/{intentId}/review/corrections:
    post:
      tags:
      - 점주 AI 인터뷰
      operationId: correctManualInterviewUnderstanding
      summary: 인텐트 요약 정정
      description: |-
        텍스트 또는 완료된 음성 전사로 선택한 인텐트의 요약을 정정합니다. 새 CORRECTION 턴은 path의 intentId에 귀속하고 원래 답변을 덮어쓰지 않습니다. depth를 증가시키거나 충분성 판단을 다시 적용하지 않습니다. 접수 시 검토 PROCESSING, 성공 시 READY입니다. 실패하면 검토 ERROR에서 같은 입력으로 재시도합니다. 같은 매장의 READY 전사만 사용하며 진행/실패 전사는 409 TRANSCRIPTION_NOT_READY, 다른 매장 전사는 404입니다. 정정은 기존 근무조·섹션 ID를 유지하고 삭제한 대상의 사진 연결은 해제합니다. 다른 검토가 참조하는 근무조를 삭제하면 completion은 409 MANUAL_REFERENCE_CONFLICT입니다. 생성 전에 참조하는 인텐트의 review/corrections로 유효한 근무조에 재연결하거나 해당 업무를 삭제·재분류하고, 검토가 READY가 된 뒤 전체 검토와 sessionRevision을 다시 조회하여 completion을 재요청합니다. 최종 초안 편집은 생성 완료 후 READY 초안에서만 가능하므로 생성 전 참조 충돌의 복구 경로로 사용할 수 없습니다.

        **항목별 검토·동시성**

        - path의 intentId로 완료된 COVERED 또는 NEEDS_DETAIL 항목을 지정합니다. 다른 매장/세션의 인텐트는 404 MANUAL_RESOURCE_NOT_FOUND, 아직 PENDING이면 409 REVIEW_NOT_READY입니다. content.intentId는 반드시 path와 일치합니다.
        - 검토는 세션의 질문 진행과 독립적입니다. COLLECTING, PROCESSING, READY_TO_GENERATE에서 완료된 이전 항목을 검토할 수 있으며 현재 질문·인텐트·depth를 바꾸지 않습니다. 확인은 다음 질문과 초안 생성의 선행 조건이 아닙니다.
        - 변경의 expectedRevision은 해당 검토 리소스 revision입니다. 질문 진행의 session revision과 별개이며 불일치는 409 REVISION_CONFLICT입니다. 변경 시 검토 revision만 증가합니다. GET 목록은 sessionRevision과 전체 검토를 같은 읽기 스냅샷으로 반환합니다.
