      summary: 음성 전사 상태·텍스트 조회
      description: |-
        RUNNING / READY / ERROR를 200으로 반환합니다. ERROR는 공개 오류와 retryable을 포함하며 실패를 성공으로 표시하지 않습니다. 2초 간격 polling을 권장하며 429 Retry-After를 따릅니다. 전사 ID는 매장에 귀속됩니다.

