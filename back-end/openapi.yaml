  /api/stores/{storeId}/manual/draft/corrections:
    post:
      tags:
      - 점주 매뉴얼
      operationId: createManualDraftCorrection
      summary: 생성된 초안의 음성·텍스트 정정 요청
      description: |-
        READY인 현재 초안만 정정합니다. 0.12.0부터 input.method=MEDIA는 말 대신 target 섹션(target.kind=SECTION만)에 연결된 사진·영상을 AI가 보고 그 섹션의 단계를 작성·보강합니다. 같은 작업 리소스·잠금·조회·재시도·오류 규칙을 그대로 사용하며, 섹션에 사진·영상이 없으면 422 VALIDATION_ERROR(target.targetId)입니다. 사진·영상에서 읽은 내용은 점주 발화와 같은 근거로 쓰되 근거 없는 단계는 추가하지 않고 기존 단계를 근거 없이 지우지 않습니다. 완료된 인터뷰의 요약 정정은 다시 열지 않으며 원문 답변·평가·기존 게시본을 변경하지 않습니다. MVP는 기존 INTERVIEW_AUDIO 업로드·전사를 재사용하고 원문 확인 없이 VOICE를 제출합니다. TEXT 입력도 계약상 허용합니다.

        expectedVersionId와 expectedRevision은 필수입니다. 현재 매장 소유권·APPROVED·CSRF를 확인하고 멱등성 결과를 검사합니다. 같은 key·본문은 최초 결과만 재현하며 같은 key의 다른 본문은 409 IDEMPOTENCY_KEY_REUSED입니다. 현재 초안 포인터를 잠그고 ID·revision·READY 상태·활성 정정 작업을 검사한 뒤 작업 예약과 latestCorrection 갱신을 원자 처리합니다. 초안 없음/교체는 409 MANUAL_VERSION_CONFLICT, 같은 ID의 오래된 revision은 409 REVISION_CONFLICT입니다.

        초안당 RUNNING 작업은 하나입니다. 정정 중 추가 정정·전체 편집·부족 항목 확인·게시·새 인터뷰 시작(초안 교체)은 409 MANUAL_CORRECTION_IN_PROGRESS입니다. 각 경로는 같은 매뉴얼 잠금에 참여합니다. content와 generationStatus=READY를 유지하며 접수·실패·실질 변경 없는 성공은 content revision을 증가시키지 않습니다. 조회·미리보기는 마지막 저장본이며 앱은 정정 처리 중임을 표시합니다.

        worker는 실행 시도별 task ID와 attempt, 현재 versionId·baseRevision·latestCorrection.id·RUNNING 상태를 다시 검사합니다. 늦은/중복 결과는 적용하지 않습니다. 타임아웃은 AI_PROCESSING_FAILED로 종료하여 영구 RUNNING을 방지하고 외부 AI 호출 동안 DB 잠금을 유지하지 않습니다. 무효화된 작업은 ERROR로 기록하되 교체된 초안에 작업 상태나 내용을 덮어쓰지 않습니다.

        성공 시 기존 근무조·섹션·단계 ID와 무관한 내용·사진을 보존하며 새 항목의 UUID는 서버가 생성합니다. 삭제 대상의 사진 연결만 해제하고 다른 초안/게시본이 참조하는 파일은 유지합니다. 연관 업무 이동/삭제가 불분명하면 MANUAL_REFERENCE_CONFLICT, 수정 대상/의도가 불명확하면 CORRECTION_CLARIFICATION_REQUIRED로 종료합니다. 추측으로 내용·미확정 값을 채우지 않습니다. 기존 ManualContent의 시간·참조·사진·missingInformation 제약을 적용합니다.

        검증된 실질 변경은 content·issues 동기화, 부족 항목 확인 초기화, revision+1, SUCCEEDED/resultRevision 저장을 원자적으로 수행합니다. 실질 변경이 없으면 확인·revision을 유지하며 resultRevision=baseRevision입니다. resultRevision은 baseRevision 또는 baseRevision+1이며 동일 작업을 두 번 적용하지 않습니다. 실패는 이전 content·issues·확인·revision을 그대로 보존합니다.

        ERROR 뒤 사용자는 재시도 또는 새 발화로 정정할 수 있습니다. 실패 안내 후 기존 내용을 명시적으로 다시 확인하면 기존 publication의 confirmed=true와 최신 versionId/revision으로 게시할 수 있습니다. 실패를 성공으로 표시하거나 자동 게시하지 않습니다. 원문 전사 snapshot과 target을 작업에 보존하므로 정정 재시도는 원본 음성 파일 수명과 독립적이며 전사/AI 원문·provider 오류는 응답·로그에 노출하지 않습니다.

        target.kind=MANUAL은 targetId=null, SHIFT/SECTION은 현재 초안의 해당 항목 UUID입니다. 다른 매장·다른 버전·존재하지 않는 대상은 404 MANUAL_RESOURCE_NOT_FOUND입니다. SECTION에서 단계 정정을 함께 설명할 수 있습니다. 같은 매장의 READY 전사만 받으며 다른 매장 전사는 404, RUNNING/ERROR 전사는 409 TRANSCRIPTION_NOT_READY입니다. 선택 target은 정정 문맥이며 연결 참조를 변경해야 할 경우 명시된 의도 안에서만 처리합니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 해당 세션 또는 초안의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 상태 갱신·작업 예약·outbox 저장은 원자적입니다. 예약 실패는 **503 JOB_QUEUE_UNAVAILABLE**이며 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
