openapi: 3.1.0
info:
  title: 지단 API 설계 명세
  version: 0.12.0
  description: |-
    Figma 인증·회원·매장·근무자 관리, 공고·지원·근무 확정, 홈·캘린더·알림, 매뉴얼·AI 인터뷰·업무 질문을 위한 구현 전 계약입니다.

    이 명세의 인증·업무 API/OAuth/DB 처리는 구현 전이며 Swagger는 문서 검수용입니다. 요청 실행은 비활성화되어 있습니다.

    Google 이메일은 검증된 Google ID token에서 서버가 가져오고 요청 본문으로 받지 않습니다.

    일반 회원 인증은 브라우저의 동일 출처 /api 프록시와 opaque HttpOnly 세션 쿠키를 사용합니다.

    관리자 매장 승인 API는 요청 JSON body의 password로 매 요청 인증합니다.

    점주 운영 API는 회원 세션으로 매장 소유권과 APPROVED를 확인하고 변경 요청에는 CSRF를 요구합니다.

    초대 링크의 7일 기한과 자료 접근 기간은 별개입니다. 접근 종료일은 초대 시 선택할 수 있고 점주는 직접 종료할 수도 있습니다.

    매뉴얼은 점주 답변 → AI 초안 → 점주 검토·발행 순서이며 자동 발행하지 않습니다.

    질문 하나 → 답변 하나 → Jev 판단을 반복합니다. 충분하면 다음 필수 질문, 부족하면 추가 질문 한 개를 제시합니다. depth 5에서도 부족하면 검수중으로 표시하고 다음 인텐트로 진행합니다.

    인터뷰·생성·음성 전사는 비동기 상태와 재시도를 지원하며 답변·질문 위치·게시 버전을 보존합니다.

    근무 요청 수락과 동시에 공고를 마감하고, 근무 시작 전 확정 철회 시 다시 모집 중으로 엽니다. 요청 기한은 요청 후 1시간과 근무 시작 중 먼저 오는 시각입니다.

    MVP 캘린더는 전체 매장의 확정 대타와 완료 이력 월별 조회만 제공합니다. 추천은 가능 시간 일치 우선, 같은 일치 여부 안에서는 근무일 가까운 순입니다.

    state·nonce, 세션 만료 시간, 쿠키 방식·업로드 상한·보관 기간과 오류 정책은 화면에 없는 설계 제안입니다.

    로그인 시작 → Google callback → 기존 회원은 세션, 신규 회원은 10분 가입 세션 → 가입 완료 순서입니다.

    일반 회원의 비밀번호 로그인/이메일 인증/비밀번호 재설정은 이 화면 범위에 없습니다.

    모든 응답에는 Cache-Control: no-store를 적용하고 세션/개인정보를 로그에 남기지 않습니다.

    모든 응답에는 서버가 요청마다 새로 만든 추적 ID `X-Request-ID` 헤더(예: req_0123456789abcdef)가 한 개 있습니다. 같은 요청의 서버 로그와 오류 본문 `requestId`에 같은 값이 쓰입니다. 클라이언트가 보낸 `X-Request-ID` 등의 값은 읽거나 되돌려주지 않습니다.
  contact:
    name: Jidan 팀
    url: https://github.com/2026-KW-HACKATHON/29_Jidan
  license:
    name: 프로젝트 내부 설계 문서
    url: https://github.com/2026-KW-HACKATHON/29_Jidan
servers:
- url: https://dev-jidan.leehyowon14.dev
  description: 개발 API 서버 (업무 API 구현 전; 각 endpoint 경로에 /api 포함)
- url: http://127.0.0.1:8000
  description: 향후 로컬 API 구현 서버 (5500은 문서 전용)
tags:
- name: Google 인증
  description: Google 계정으로 로그인 또는 최초 가입 시작
- name: 가입
  description: Google 인증 이후 가입 컨텍스트 및 일반회원·점주 등록
- name: 세션
  description: 현재 사용자와 권한 조회, CSRF 토큰 발급 및 로그아웃
- name: 매장 승인 관리
  description: 요청 body의 관리자 password로 신청을 전체 조회하고 승인 처리
- name: 일반회원 프로필
  description: 로그인한 일반회원의 프로필 조회 및 기본 정보·경력·가능 시간 수정
- name: 점주 매장 관리
  description: 내 관리 매장 조회·추가 신청과 운영 현황 요약
- name: 근무자 초대
  description: 승인된 매장의 이메일 초대와 발송·수락·거절 관리
- name: 근무자 관리
  description: 근무자별 매장 자료 접근 조회와 점주의 수동 종료
- name: 점주 매뉴얼
  description: 점주 검토·편집·발행 및 초안 관리
- name: 매뉴얼 미디어
  description: 매장에 귀속된 비공개 사진·음성 업로드와 보호 조회
- name: 점주 AI 인터뷰
  description: 점주 답변 수집·가변 추가 질문·이해 확인·오류 복구 및 초안 생성
- name: 근무자 매뉴얼
  description: 현재 유효한 매장 자료 접근으로 점주가 게시한 업무 목록·단계 열람
- name: 점주 대타 공고
  description: 점주 공고 등록·모집 중/마감 관리
- name: 대타 공고 탐색
  description: 일반회원 공고 검색·필터·상세
- name: 일반회원 공고 지원
  description: 일반회원 자기소개 지원·철회·탭별 이력
- name: 점주 지원자 확인
  description: 내 매장 공고 지원서와 제출 당시 근무자 프로필
- name: 대타 근무 요청
  description: 요청·기한·응답·근무 확정과 매뉴얼 접근 연결
- name: 일반회원 초대함
  description: 검증 이메일로 받은 매장 초대 조회·응답
- name: 공통 알림
  description: 회원별 전체/안 읽음 알림과 읽음 처리
- name: 근무자 매장 선택
  description: 본인 매장 자료 접근과 매뉴얼 매장 선택
- name: 근무 캘린더
  description: 전체 매장 월별 확정 대타 조회; 정기 일정과 편집은 MVP 제외
- name: 관심 매장
  description: 홈 관심 매장 건수와 본인 목록 관리
- name: 홈 요약
  description: 역할별 홈 활동·관리 매장·추천과 공고 요약
- name: AI 질문 미디어
  description: 근무자 AI 질문의 비공개 사진·음성과 전사
- name: 근무자 AI 업무 질문
  description: 게시 매뉴얼 근거가 있는 업무 답변·대화·실패 복구
security:
- SessionCookie: []
externalDocs:
  description: 기준 Figma Design 페이지
  url: https://www.figma.com/design/ZaFHresnBXJ1h98Xl1AUDj?node-id=0-1
paths:
  /api/auth/google:
    get:
      tags:
      - Google 인증
      operationId: startGoogleLogin
      summary: Google 로그인 시작
      security: []
      description: |-
        Google 버튼에서 페이지 이동으로 호출하며, Google OAuth authorization URL로 **302** 응답합니다.

        **로그인 트랜잭션**

        - 서버는 5분 일회용 `state`·`nonce`와 브라우저 바인딩 트랜잭션을 생성합니다.
        - `jidan_oauth` 쿠키를 설정하고 callback에서 폐기합니다.
        - 로그아웃 서버 폐기용 `jidan_oauth_logout` 보조 쿠키도 설정합니다(동일 opaque 바인딩, HttpOnly·SameSite=Lax·Path=/api/auth·Max-Age=300). callback과 logout에서 함께 삭제하며 회원 인증에는 사용하지 않습니다.
        - 쿠키 속성: `HttpOnly; Secure; SameSite=Lax; Path=/api/auth/google`

        **인증 설정**

        - Google scope: `openid email profile`
        - `redirect_uri`: 서버에 설정된 callback URI만 사용합니다.
        - `state`는 서버가 생성하며 클라이언트가 지정할 수 없습니다. 외부 `returnUrl`은 받지 않습니다.
        - 기존 유효 세션은 callback 전까지 유지하고, 인증 성공 후 세션 ID를 회전합니다.
      responses:
        '302':
          description: Google 인증 화면으로 이동
          headers:
            Location:
              description: 고정된 프론트엔드 경로 또는 Google authorization URL. 임의 redirect URL을 입력받지 않음. 인증 토큰은
                URL에 포함하지 않음.
              schema:
                type: string
                format: uri
              example: http://127.0.0.1:5184/__auth/signup
            Set-Cookie:
              description: 일회용 OAuth 브라우저 바인딩 쿠키와 로그아웃용 보조 바인딩 쿠키를 각각 별도 Set-Cookie로 설정
              schema:
                type: string
              example: jidan_oauth=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/google; Max-Age=300
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/google/callback:
    get:
      tags:
      - Google 인증
      operationId: completeGoogleLogin
      summary: Google 인증 결과 처리 및 기존/신규 분기
      security: []
      description: |-
        Google이 호출하는 브라우저 callback입니다.

        **검증 순서**

        1. `state`와 `jidan_oauth`의 바인딩·만료·일회성을 검증한 뒤 `code`를 교환합니다.
        2. `code` 또는 `error` 중 정확히 하나가 필요합니다. 동시 제공·누락·중복 query parameter는 **400**입니다.
        3. ID token의 서명·`iss`·`aud`·`exp`·`nonce`·`email_verified`를 검증합니다.
        4. `provider=GOOGLE`과 `sub`로 회원을 찾습니다.

        **인증 결과에 따른 이동**

        - **기존 ACTIVE 회원**: 새 회원 세션을 발급하고 가입 세션을 삭제합니다.
          이동 경로: `http://127.0.0.1:5184/__auth/session`
        - **신규 주체**: 가입 세션을 발급하고 기존 회원 세션을 삭제합니다.
          이동 경로: `http://127.0.0.1:5184/__auth/signup`
        - **동의 취소** (`error=access_denied`): 로그인 화면으로 **302** 이동하며 공개 오류 코드 `GOOGLE_ACCESS_DENIED`만 전달합니다.

        이 경로는 프론트엔드 구현 시 확정할 제안입니다. 운영 frontend origin은 서버 설정값을 사용합니다.

        **오류 응답**

        | 상황 | HTTP 상태 | 오류 코드 |
        | --- | --- | --- |
        | state 오류 | 400 | `OAUTH_STATE_INVALID` |
        | code 재사용 | 400 | `OAUTH_CODE_INVALID` |
        | ID token 검증 실패 | 401 | `GOOGLE_IDENTITY_INVALID` |
        | 정지 계정 | 403 | `ACCOUNT_SUSPENDED` |

        **오류 처리와 정보 보호**

        - `state`는 Google error 응답에서도 필수입니다.
        - 오류 시 새 세션을 발급하지 않고 트랜잭션을 폐기합니다.
        - 원시 `code`, ID token, Google `error_description`은 프론트 URL·응답·로그에 노출하지 않습니다.
      parameters:
      - name: state
        in: query
        required: true
        description: 서버가 생성한 OAuth state. 쿠키의 로그인 트랜잭션과 비교.
        schema:
          type: string
          minLength: 32
          maxLength: 512
        example: example_state_value_0123456789abcdef
      - name: code
        in: query
        description: Google 일회용 authorization code. error와 상호 배타.
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: error
        in: query
        description: Google OAuth 오류. code와 상호 배타.
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: access_denied
      - name: jidan_oauth
        in: cookie
        required: true
        description: 로그인 시작에서 설정한 브라우저 바인딩 쿠키. 누락·만료·state 불일치는 400.
        schema:
          type: string
          minLength: 1
      responses:
        '302':
          description: 기존 회원/신규 가입/동의 취소에 따라 프론트엔드로 이동
          headers:
            Location:
              description: 고정된 프론트엔드 경로 또는 Google authorization URL. 임의 redirect URL을 입력받지 않음. 인증 토큰은
                URL에 포함하지 않음.
              schema:
                type: string
                format: uri
              example: http://127.0.0.1:5184/__auth/signup
            Set-Cookie:
              description: |-
                가입 세션을 설정.

                운영에서는 Secure, 로컬 HTTP에서만 Secure 생략.

                callback 오류 시 login 트랜잭션 쿠키 폐기.

                기존 회원이면 대신 jidan_session 설정.

                각각 별도 Set-Cookie 헤더로 전달.
              schema:
                type: string
              example: jidan_registration=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth; Max-Age=600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/registration:
    get:
      tags:
      - 가입
      operationId: getRegistrationContext
      summary: 최초 가입의 Google 이메일·가능한 가입 유형 조회
      security:
      - RegistrationCookie: []
      description: |-
        가입 유형 선택·등록 화면에 진입할 때 호출합니다.

        - 가입 컨텍스트의 `email`은 읽기 전용입니다.
        - 회원 세션만 있으면 **403 · `ALREADY_REGISTERED`**입니다.
        - 가입 세션이 만료되면 입력값을 로컬에서 유지한 채 Google 로그인을 다시 시도합니다.
      responses:
        '200':
          description: Google 인증 이후 가입 전 컨텍스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationContext'
              example:
                identity:
                  provider: GOOGLE
                  email: member@example.com
                  emailVerified: true
                expiresAt: '2026-10-02T10:10:00Z'
                allowedRoles:
                - WORKER
                - OWNER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/registrations/workers:
    post:
      tags:
      - 가입
      operationId: registerWorker
      summary: 일반회원 프로필 등록 및 가입 완료
      security:
      - RegistrationCookie: []
        CsrfToken: []
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: |-
        **요청 조건**

        - Google 가입 세션 + X-CSRF-Token + 허용된 Origin 필요. 역할과 이메일은 서버가 결정한다.
        - 가입 세션일 때만 새 회원 생성 가능. 회원 세션은 동일 주체의 성공한 Idempotency-Key 재시도만 허용하며 그 외 409 ALREADY_REGISTERED.
        - Origin은 허용 목록의 정확한 scheme/host/port로 검증하며 임의 Origin/누락은 403 CSRF_INVALID.

        **저장과 재시도**

        - 가입/프로필(점주는 매장 포함) 저장과 key 결과 기록은 같은 트랜잭션. 성공 후 가입 세션을 폐기하고 회원 세션으로 교체.
        - 실패 시 입력값 유지. 같은 key와 본문으로 재시도하면 중복 저장 없이 최초 201 결과 재현.

        **근무 프로필 검증**

        - 신입은 `careers=[]`, 경력은 최소 1건이 필요합니다.
        - 현재 근무 중이면 `endMonth=null`입니다.
        - 생일·경력 연월 순서·가능 시간 중첩은 서버에서 검증합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistrationRequest'
            examples:
              newWorker:
                summary: 신입 · 월/수/금 주간 근무
                value:
                  name: 김지수
                  phoneNumber: '01012345678'
                  birthDate: '2001-03-14'
                  gender: FEMALE
                  experienceLevel: NEW
                  careers: []
                  availabilities:
                  - days:
