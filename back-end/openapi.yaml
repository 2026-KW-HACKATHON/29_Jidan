                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '이메일 불일치: INVITATION_EMAIL_MISMATCH. 역할·정지·매장 승인·CSRF 정책 위반. 이메일 불일치 시 초대 정보 미노출.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVITATION_EMAIL_MISMATCH
                message: 초대 받은 Google 계정으로 로그인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패. 모든 변경을 rollback합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '400':
          description: 잘못된 JSON 요청.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: JSON 요청 형식을 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: 없는 토큰 또는 교체된 토큰.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVITATION_NOT_FOUND
                message: 초대를 찾을 수 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '409':
          description: '수락/거절/취소 등 현재 상태에서 사용할 수 없는 작업: INVITATION_STATE_CONFLICT.'
          content:
