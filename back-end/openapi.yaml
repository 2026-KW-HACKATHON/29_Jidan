  /api/owners/me/calendar/events:
    get:
      tags:
      - 근무 캘린더
      operationId: getOwnerWorkCalendarMonth
      summary: 점주의 전체 소유 매장 대타 월별 캘린더
      description: |-
        ACTIVE OWNER 세션이 필요합니다. 현재 소유한 APPROVED 매장 전체만 조회합니다. 승인 대기 매장은 제외하고 대상이 없으면 200 events=[]입니다. storeId 필터가 타인/없는 매장이면 404 RESOURCE_NOT_FOUND, 본인 승인 대기 매장이면 403 STORE_APPROVAL_REQUIRED입니다.

        사용자 확정 MVP 범위: 전체 매장 월별 캘린더 조회만 제공합니다. 확정 대타 TEMPORARY_WORK만 반환하고 정기 근무·매장 일반 일정 및 일정 등록/수정/삭제/개별 상세 API는 제외합니다. 정기 접근 기간·가입 가능 시간·매뉴얼 근무조는 실제 일정으로 생성하지 않습니다.

        조회 월의 서울 00:00부터 다음 월 00:00까지와 겹치는 [startAt,endAt) 일정을 startAt ASC,id ASC로 반환합니다. 월말 심야 일정은 원래 시작/종료를 유지하며 경계만 닿으면 제외합니다. 최대 1000개를 넘으면 잘린 결과 대신 422 CALENDAR_RANGE_TOO_LARGE입니다. 빈 월은 200 events=[]입니다.

        근무 요청 수락의 현재 확정 및 완료된 과거 대타 이력만 반환합니다. CONFIRMATION_WITHDRAWN 일정 연결은 제외하고 감사 이력은 저장합니다. 이미 CANCELLED/DECLINED/EXPIRED인 요청은 일정이 생성되지 않습니다. 조회 asOf로 시작·종료/철회 상태를 판정하며 배치 지연으로 취소 일정이 노출되지 않습니다.

        storeId 생략 시 모든 소유 승인 매장을 합쳐 반환합니다. 점주 홈에서 선택한 매장만 볼 때는 선택적 storeId 필터를 사용합니다. 타인의 매장/근무자 정보는 포함하지 않습니다. 현재 소유권·매장 승인 상태를 매 조회 재검증합니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.
      security:
      - SessionCookie: []
      parameters:
      - name: month
        in: query
        required: true
        description: 서울 기준 조회 연월, 필수
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
      - name: storeId
        in: query
        required: false
        description: 선택적 소유 매장 필터; 생략=전체 소유 승인 매장
        schema:
