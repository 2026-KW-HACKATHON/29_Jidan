      operationId: applyForJobPosting
      summary: 자기소개 작성 후 공고 지원
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다.

        자기소개 1~500자(공백만 거절)를 제출합니다. 세션 근무자의 이름·나이·직접 등록 경력 스냅샷을 지원 시도마다 저장하며 연락처·생일·Google 이메일은 포함하지 않습니다. 최소 경력은 모집 조건 안내용이며 자동 지원 차단하지 않습니다.

        모집 중·미래 시작·미확정 공고만 지원할 수 있습니다. 철회 후에는 같은 공고 페이지에서 새 Idempotency-Key로 재지원할 수 있습니다. 매장+공고+회원의 현재 유효 지원(APPLIED/REQUESTED/CONFIRMED)은 최대 1개라는 유일성을 지킵니다. 새 지원 시도는 새 applicationId와 최신 자기소개·프로필 스냅샷을 생성하고 이전 WITHDRAWN 레코드·관련 CANCELLED 요청은 수정하거나 복구하지 않습니다.

        새 key 중복 활성 지원은 409 APPLICATION_ALREADY_ACTIVE입니다. 이전 성공 key 재사용은 최초 결과만 재현하며 재지원 동작이 아닙니다. 재지원은 새 key를 사용합니다. 공고 마감/확정과 같은 잠금으로 지원·지원자 수·알림 outbox를 원자 처리합니다.

        응답은 Cache-Control: no-store입니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
