      summary: 공고 신청 철회
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다.

        APPLIED/REQUESTED→WITHDRAWN. 유효 미결 근무 요청도 같은 트랜잭션에서 CANCELLED로 만들고 지원자 수를 줄입니다. owner 요청/worker 수락/마감과 공고 잠금을 공유합니다. 이미 WITHDRAWN이면 최신 revision으로 200 현재 결과, CONFIRMED/COMPLETED/NOT_SELECTED는 409 APPLICATION_NOT_WITHDRAWABLE입니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: 'applicationId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 같은 논리 요청의 재시도에는 동일 UUID를 사용합니다.
        schema:
          type: string
          format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
                requestId: req_chapter_100
                fieldErrors: []
        '404':
