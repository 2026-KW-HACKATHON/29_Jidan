        expiresAt:
          type: string
          format: date-time
          description: 생성 후 정확히 7일. 재전송해도 유지하는 초대 링크의 수락 가능 시각(종료 제외).
        accessExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 수락 후 매장 자료 접근 종료 시각(종료 제외). null은 점주가 직접 종료할 때까지. 초대 링크 기간과 별개.
