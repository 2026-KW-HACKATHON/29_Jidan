  /api/stores/{storeId}/workers/{workerId}:
    get:
      tags:
      - 근무자 관리
      operationId: getStoreWorker
      summary: 근무자 자료 접근 상세 조회
      description: |-
        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **근무자와 접근 기간**

        - 해당 매장의 자료 접근 이력이 있는 근무자만 조회합니다. 현재 유효 접근만 있는 ACTIVE 탭이 기본이며 EXPIRING을 포함합니다.
        - 이름·담당 업무·정기/대타 유형·접근 시작/종료와 세 자료 권한만 제공하며 이메일·연락처·생일·가입 프로필 전체는 노출하지 않습니다.
        - 정기는 초대 수락에서, 대타는 후속 확정 근무에서 접근을 생성합니다. 대타 모집/확정 API는 이번 범위에 없습니다.
        - 같은 근무자에게 여러 자료 접근이 있어도 목록에 한 번만 표시하고 개별 `accessGrants`를 시작 시각/ID 내림차순으로 반환합니다. 근무자는 최근 접근 시작 시각/workerId 내림차순입니다.
        - 현재 시각이 `startedAt <= now < validUntil`(null이면 종료 없음)이고 revokedAt이 없으면 유효합니다. 종료 시각에 도달하면 EXPIRED, 수동 종료는 REVOKED입니다.
        - 개별 유효 권한의 종료까지 24시간 이내면 EXPIRING입니다. 근무자 전체는 유효 권한 중 하나라도 ACTIVE면 ACTIVE, 모두 EXPIRING이면 EXPIRING, 유효 권한이 없으면 ENDED입니다.
        - `activeCount`는 서로 다른 현재 근무자 수이며 expiringCount를 포함합니다. 모든 유효 권한이 곧 끝날 때만 해당 근무자를 expiringCount로 셉니다. 무기한 정기 접근이 있으면 대타 기간이 임박해도 만료 예정 근무자로 세지 않습니다.
        - 근무자 계정 ACTIVE와 매장 승인 상태도 실제 자료 접근 시 재확인합니다. 응답 권한을 접근 증명으로 사용하지 않습니다.

        **목록 조회**

        - 기본 `page=0`, `size=20`, 최대 `size=100`은 설계 제안입니다.
        - 빈 결과나 마지막 페이지 이후는 **200**, `items=[]`입니다.
        - 목록·건수·`asOf`는 한 DB 읽기 스냅샷 기준입니다. 페이지 사이의 신규 등록/상태 변경으로 순서가 달라질 수 있습니다.

        - 근무자 UUID만으로 전체 프로필을 검색하지 않습니다. 먼저 URL 매장의 소유권과 이 매장의 접근 이력을 검증합니다.
        - 여러 접근의 이력·상태를 함께 표시하며 점주의 접근 종료는 해당 근무자의 현재 자료 접근 전체에 적용합니다.
      security:
      - SessionCookie: []
      responses:
        '200':
          description: 매장 근무자의 개별 접근 상세
          content:
