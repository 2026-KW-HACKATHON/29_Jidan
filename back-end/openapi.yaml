  /api/stores/{storeId}/job-postings/{jobId}/closure:
    post:
      tags:
      - 점주 대타 공고
      operationId: closeJobPosting
      summary: 지원자 선정 없이 모집 마감 또는 마감 상태 재확인
      description: |-
        ACTIVE OWNER 세션, 해당 매장의 소유권과 APPROVED를 매 요청 확인합니다. 소유권 없는/없는 매장은 동일 404 RESOURCE_NOT_FOUND입니다.

        사용자 확정 정책: 근무 요청 수락 시 공고는 이미 CLOSED입니다. 이 API는 미확정 RECRUITING 공고의 수동 마감에 사용합니다. 현재 유효 PENDING 요청이 있으면 409 WORK_REQUEST_WITHDRAWAL_REQUIRED로 먼저 요청 철회하기를 호출합니다. 기한에 도달한 요청은 배치 지연과 무관하게 EXPIRED로 간주하며 마감을 막지 않습니다.

        이미 CLOSED인 공고는 근무 시작 전·진행 중(startAt <= now < endAt)·완료 후 모두 최신 expectedRevision으로 200 현재 결과를 반환합니다. 최초 closedAt과 revision, 요청 ACCEPTED, 지원 CONFIRMED/COMPLETED, 접근·캘린더 이력을 유지합니다. 재마감은 확정 철회나 자료 접근 종료가 아닙니다.

        새 key는 먼저 expectedRevision으로 공고를 잠그고 최신 공고 revision 일치를 검사합니다. 미확정 RECRUITING→CLOSED로 전환하며 closedAt=마감 시각을 기록하고 현재 APPLIED/REQUESTED 지원만 NOT_SELECTED로 종료합니다. 만료된 요청은 EXPIRED 이력으로 정리하고 지원 WITHDRAWN·확정 철회 이력은 보존합니다. 수락·지원·철회·마감은 공고 잠금으로 직렬화하여 첫 성공만 반영하고 원자 처리합니다. 철회 후 최신 공고 revision을 다시 조회해 사용합니다. CLOSED에는 같은 최신 revision 요청으로 200 현재 결과(재마감), 동일 Idempotency-Key 재시도는 최초 결과입니다.

        응답은 Cache-Control: no-store입니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: storeId
        in: path
        required: true
        description: 'storeId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: jobId
        in: path
        required: true
        description: 'jobId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 같은 논리 요청의 재시도에는 동일 UUID를 사용합니다.
        schema:
          type: string
          format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
                requestId: req_chapter_100
                fieldErrors: []
        '404':
