  /api/stores/{storeId}/manual/draft/preview:
    get:
      tags:
      - 점주 매뉴얼
      operationId: previewManualForWorker
      summary: 게시 전 근무자 화면 미리보기
      description: |-
        READY 초안의 근무 구조·업무·사진을 근무자 표시 형태로 제공합니다. 실제 근무자에게 접근을 부여하거나 게시본 포인터를 바꾸지 않습니다. preview=true로 게시 전 상태를 표시합니다. OWNER 전용이고 WORKER는 403입니다.

        전체 content를 반환하고 프론트가 페이지/업무별로 나눠 보여줍니다. 초안의 대화 이력·평가 입력·부족 항목 내부 정보는 포함하지 않습니다. 사진은 동일한 보호 조회 endpoint를 사용합니다. READY가 아닌 초안은 409 MANUAL_NOT_READY입니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        초안 정정 중에도 마지막 저장된 READY 내용과 revision을 반환합니다. 앱은 GET draft의 latestCorrection을 확인하여 처리 중임을 표시하고 게시를 차단합니다. generationStatus는 최초 생성 상태이며 정정 실패로 content를 null로 바꾸지 않습니다.
      security:
