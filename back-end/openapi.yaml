      summary: 점주 근무 요청 철회 (수락 대기)
      description: |-
        ACTIVE OWNER 세션, 해당 매장의 소유권과 APPROVED를 매 요청 확인합니다. 소유권 없는/없는 매장은 동일 404 RESOURCE_NOT_FOUND입니다.

        첨부 수정 디자인의 수락 대기 화면 하단 요청 철회하기입니다. 해당 매장·공고의 현재 PENDING 요청이고 now < expiresAt인 경우에만 expectedRevision을 확인해 철회합니다. 기한과 같은 시각부터는 409 WORK_REQUEST_EXPIRED입니다. 수락·철회는 동일 공고→요청→지원 잠금 순서로 직렬화하여 첫 성공만 반영합니다.

        PENDING→CANCELLED, endedAt=서버 철회 시각, respondedAt=null, accessGrant=null입니다. 관련 지원은 REQUESTED→APPLIED로 복구하고 revision/공고 revision을 증가시킵니다. 지원자 신청 철회와는 다른 동작입니다. 기존 요청 이력은 보존하며 새 요청은 새 requestId·Idempotency-Key로 생성합니다. 오래된 요청 링크의 수락은 409 WORK_REQUEST_NOT_PENDING입니다. ACCEPTED 요청은 여기서 철회할 수 없습니다.

        요청 상태·지원 상태·공고 revision·근무자 알림 outbox를 같은 트랜잭션으로 변경합니다. 동일 key는 최초 200 결과를 재현하고 새 key로 이미 종료된 요청은 409입니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
