                  kind: QUESTION
                  speaker: AI
                  questionKind: BASE
                  depth: 0
                  batchId: null
                  replyToQuestionId: null
                  inputMethod: null
                  content: 근무조와 시간을 알려주세요.
                  photoIds: []
                  createdAt: '2026-10-05T01:00:00Z'
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
                asOf: '2026-10-05T01:00:00Z'
      parameters:
      - name: storeId
        in: path
        required: true
        description: 대상 매장 UUID
        schema:
          type: string
          format: uuid
        example: 51c1c743-d377-4e7a-8449-94377eecfce0
      - name: sessionId
        in: path
        required: true
        description: 매장에 속한 리소스 UUID.
        schema:
          type: string
          format: uuid
        example: c701b623-889c-4d28-b055-501251ac6773
      - name: page
        in: query
        description: 0부터 시작. 생략 시 0.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        description: 기본 20, 최대 100. 상한은 설계 제안.
        schema:
