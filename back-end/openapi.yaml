      required:
      - id
      - instruction
      - checklistItem
    ManualPhotoAttachment:
      type: object
      additionalProperties: false
      description: |-
        업무·근무 구조에 연결한 사진 또는 영상(0.12.0). 사진 항목의 모양은 0.11.0과 같습니다(kind·posterMediaId 생략 = 사진).
        영상(MANUAL_VIDEO)을 연결하면 점주용 응답(검토·초안·게시 응답)은 mediaId=영상 ID, kind=VIDEO, posterMediaId=서버가 업로드 때 뽑아 저장한 대표 프레임 사진 ID를 보여 줍니다.
        근무자 화면(게시본 목록·업무 상세)과 초안 미리보기는 영상 원본을 노출하지 않고 대표 프레임 사진만 mediaId로 보여 줍니다(kind·posterMediaId 없음). 사진 byte는 posterMediaId(근무자는 mediaId)로 기존 사진 조회 API에서 받습니다.
        요청의 kind·posterMediaId는 생략해도 되며 보내더라도 서버가 mediaId의 실제 파일로 다시 정합니다(조회 응답을 그대로 다시 보내는 왕복 편집 허용).
      properties:
        mediaId:
          type: string
          format: uuid
        kind:
          enum:
          - PHOTO
          - VIDEO
          description: 생략은 PHOTO입니다. 서버는 영상 항목에만 VIDEO를 붙입니다.
        posterMediaId:
          type: string
          format: uuid
          description: kind=VIDEO일 때만 있습니다. 영상 업로드 때 서버가 만든 대표 프레임 사진(MANUAL_PHOTO 파생) ID입니다.
        caption:
          type:
          - string
          - 'null'
          maxLength: 300
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: '사진 이름. 예: 재고 배치, 열쇠 위치. caption은 별도의 선택 설명입니다. MVP는 이름 입력 없이 앱이 최초 연결 시 사진 1 같은 기본 이름을 부여하고 caption=null을 보냅니다. 재조회·재시도·순서 변경 시 저장한 이름을 유지합니다.'
      required:
      - mediaId
      - caption
      - title
      oneOf:
      - type: object
        properties:
          kind:
            const: PHOTO
        not:
          properties:
            posterMediaId:
              type: string
          required:
          - posterMediaId
      - type: object
        properties:
          kind:
            const: VIDEO
          posterMediaId:
            type: string
            format: uuid
        required:
        - kind
        - posterMediaId
    ManualSection:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        category:
          enum:
          - COMMON_TASK
          - SHIFT_TASK
          - RULE
          - EQUIPMENT
        shiftId:
          type:
          - string
          - 'null'
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        steps:
          type: array
          items:
