                  role: OWNER
                  name: 김민수
                  identity:
                    provider: GOOGLE
                    email: owner@example.com
                    emailVerified: true
                  phoneNumber: '01012345678'
                  profileCompleted: true
                  permissions:
                  - READ_OWN_STORE_STATUS
                  stores:
                  - storeId: 51c1c743-d377-4e7a-8449-94377eecfce0
                    storeName: 명랑핫도그 광운대점
                    approvalStatus: PENDING
                    permissions:
                    - READ_STORE_STATUS
                expiresAt: '2026-10-03T10:00:00Z'
                nextAction: OWNER_APPROVAL_PENDING
          headers:
            Set-Cookie:
              description: |-
                jidan_session을 설정하고 jidan_registration을 Max-Age=0으로 삭제.

                별도 Set-Cookie 헤더 사용.

                기존 쿠키와 CSRF 토큰을 회전.

                운영에서 Secure, 로컬 HTTP에서만 Secure 생략.
              schema:
                type: string
              example: jidan_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/session:
    get:
      tags:
