  /api/stores/{storeId}/invitations/{invitationId}/resend:
    post:
      tags:
      - 근무자 초대
      operationId: resendStoreInvitation
      summary: 초대 이메일 재전송
      description: |-
        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **재전송 정책**

        - 같은 매장에 속하는 현재 유효한 PENDING 초대만 재전송할 수 있습니다. 대상 이메일·접근 종료·생성/링크 만료 시각은 변경하지 않습니다.
        - 메일 큐 기록과 `lastSentAt`·새 token hash를 함께 갱신합니다. 이전 토큰은 즉시 무효화하고 새 링크를 메일로 보냅니다. **7일 기한을 연장하지 않습니다.**
        - 수락/거절/취소 상태는 **409 INVITATION_STATE_CONFLICT**, 기한이 지난 대기 초대는 **410**입니다.
        - `Idempotency-Key`는 클릭마다 생성한 UUID이며 같은 key의 재시도는 메일을 추가 요청하지 않고 최초 **200** 결과를 재현합니다. 상태가 바뀐 뒤 최초 결과가 재현될 수 있으므로 목록을 다시 조회합니다. 현재 회원 인증·소유권·승인 상태는 재검증합니다.
        - 새 요청의 상태를 검사하기 전에 해당 key의 성공 기록을 확인합니다. 성공 기록이 없다면 현재 상태를 검사합니다.
        - 큐 기록 실패는 **503**이며 변경을 전부 rollback해 기존 링크가 유지됩니다. 토큰은 응답으로 반환하지 않습니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '200':
          description: 재전송 요청 큐 기록. 기존 유효 기한 유지.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInvitationDelivery'
              example:
                invitation:
                  id: fc95196b-5eb0-4a9a-a24b-1a5468c19563
                  storeId: 51c1c743-d377-4e7a-8449-94377eecfce0
                  email: jisu@example.com
                  status: PENDING
                  createdAt: '2026-10-05T01:00:00Z'
                  lastSentAt: '2026-10-06T01:00:00Z'
                  expiresAt: '2026-10-12T01:00:00Z'
                  accessExpiresAt: null
                  acceptedAt: null
                  acceptedBy: null
                  declinedAt: null
                  canceledAt: null
                deliveryStatus: QUEUED
        '401':
          description: '세션 없음·만료·폐기: SESSION_EXPIRED. 가입 세션만 존재: REGISTRATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SESSION_EXPIRED
                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '다른 역할: FORBIDDEN. 정지 계정: ACCOUNT_SUSPENDED. 승인 대기: STORE_APPROVAL_REQUIRED. CSRF/Origin 오류:
            CSRF_INVALID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 이 기능을 사용할 권한이 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패. 모든 변경을 rollback합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: 없는/다른 점주의 매장은 STORE_NOT_FOUND. 소유 매장에 속하지 않거나 없는 초대는 INVITATION_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVITATION_NOT_FOUND
                message: 초대를 찾을 수 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '400':
          description: 잘못된 JSON 요청.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: JSON 요청 형식을 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '409':
          description: '이미 수락/거절 등 현재 상태에서 사용할 수 없는 작업: INVITATION_STATE_CONFLICT. key 재사용 충돌: IDEMPOTENCY_KEY_REUSED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVITATION_STATE_CONFLICT
                message: 현재 초대 상태에서는 이 작업을 할 수 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '410':
          description: 초대 링크 기간 또는 지정한 접근 기간 종료. INVITATION_EXPIRED 또는 ACCESS_PERIOD_ENDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVITATION_EXPIRED
                message: 초대 유효 기간이 지났습니다.
                requestId: req_profile_001
                fieldErrors: []
        '503':
          description: 큐 기록 실패. lastSentAt/토큰 교체도 rollback하므로 기존 링크 유지.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DELIVERY_UNAVAILABLE
                message: 재전송을 요청하지 못했습니다. 잠시 후 다시 시도해 주세요.
                requestId: req_profile_001
                fieldErrors: []
      parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/InvitationId'
      - $ref: '#/components/parameters/InvitationResendKey'
      externalDocs:
        description: 기준 Figma 화면
        url: https://www.figma.com/design/ZaFHresnBXJ1h98Xl1AUDj?node-id=506-4669
  /api/stores/{storeId}/invitations/{invitationId}/cancel:
