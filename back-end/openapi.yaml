            const: DECLINED
          respondedAt:
            type: string
            format: date-time
          endedAt:
            type: string
            format: date-time
          accessGrant:
            type: 'null'
        required:
        - status
        - respondedAt
        - endedAt
        - accessGrant
      - properties:
          status:
            type: string
            enum:
            - EXPIRED
            - CANCELLED
          respondedAt:
            type: 'null'
          endedAt:
            type: string
            format: date-time
          accessGrant:
            type: 'null'
        required:
        - status
        - respondedAt
        - endedAt
        - accessGrant
      - properties:
          status:
            const: CONFIRMATION_WITHDRAWN
          respondedAt:
            type: string
            format: date-time
          endedAt:
            type: string
            format: date-time
          accessGrant:
            $ref: '#/components/schemas/StoreAccessGrant'
            properties:
              type:
                const: TEMPORARY
              status:
                const: REVOKED
            required:
            - type
            - status
        required:
        - status
        - respondedAt
        - endedAt
        - accessGrant
      description: PENDING 요청과 ACCEPTED 확정을 구분합니다. CONFIRMATION_WITHDRAWN은 점주가 근무 시작 전에 확정을 철회한 이력이며 수락 시각 respondedAt과
        철회 시각 endedAt, REVOKED TEMPORARY 접근을 보존합니다. 근무 완료 후에도 요청 자체는 ACCEPTED 이력이고 지원은 COMPLETED입니다.
