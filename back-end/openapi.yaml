                requestId: req_chapter_100
                fieldErrors: []
        '404':
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESOURCE_NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                requestId: req_chapter_100
                fieldErrors: []
        '422':
          description: 연월 오류는 VALIDATION_ERROR, 해당 월 1000개 초과는 CALENDAR_RANGE_TOO_LARGE입니다.
