  /api/stores/{storeId}/manual/draft/publication:
    post:
      tags:
      - 점주 매뉴얼
      operationId: publishManualDraft
      summary: 점주 확인 후 매뉴얼 발행
      description: |-
        **미확정 정보와 점주 확인**

        - 근무 시간이 불명확하면 해당 startTime/endTime/endsNextDay를 null로 유지합니다. 근무조나 업무 자체가 미확정이면 shifts/sections를 빈 배열로, 절차가 미확정이면 해당 steps를 빈 배열로 표현합니다. AI는 임의의 시간·업무를 만들어 채우지 않습니다.
        - 모든 null 필드·빈 필수 배열은 missingInformation에 정확히 대응해야 합니다. MANUAL 대상의 shifts/sections는 targetId=null, SHIFT의 시간 필드는 해당 shift ID, SECTION의 steps는 해당 section ID를 지정합니다. 완성된 값에 대한 항목·다른 대상·중복 대상 필드는 422 VALIDATION_ERROR입니다. 교차 참조와 누락 대응은 서버 검증 사항입니다.
        - missingInformation.id와 같은 ID의 부족 항목 issue를 서버가 만들고 OPEN으로 유지합니다. 인터뷰 유래는 원래 intentId, 편집으로 새로 생긴 미확정 필드는 intentId=null입니다. 클라이언트는 issues나 확인 상태를 편집하지 못합니다.
        - 내용 수정 시 미확정 대상과 issue를 원자적으로 동기화하고 확인을 초기화합니다. 값이 채워진 항목의 현재 missingInformation과 연결 issue는 함께 제거하되 원래 평가와 확인 이력은 보존합니다. 같은 ID를 다른 대상으로 재사용할 수 없습니다.
        - 시간 길이 검사는 필요한 시간 값이 모두 확정된 근무조에 적용합니다. 부족 항목에 대한 점주 확인은 null/빈 배열을 임의의 확정값으로 변경하지 않습니다.

        READY 초안의 현재 expectedRevision에 대해 confirmed=true로 최종 내용을 확인하고 발행합니다. 생성 중/실패 초안·미완료 인터뷰는 409 MANUAL_NOT_READY입니다. AI 및 자동 작업은 이 endpoint를 호출하거나 자동 발행할 수 없습니다.

        **부족 항목에 대한 사용자 결정**

        - acknowledgedIssueIds에는 현재 OPEN인 항목 ID를 정확히 모두 포함합니다. 없으면 빈 배열입니다. 이미 ACKNOWLEDGED인 항목은 다시 보낼 필요가 없습니다.
        - 누락은 409 MANUAL_REVIEW_REQUIRED, 다른 초안/없는 ID는 404 MANUAL_RESOURCE_NOT_FOUND입니다. COVERED가 아니어도 점주의 명시적 확인만으로 발행 가능합니다.
        - 정보 부족 사실/설명과 원래 충분성 판단을 지우지 않습니다. 선택 항목의 확인 시각·점주 주체·초안 revision 및 최종 동의 이력을 기록합니다. 추가 답변/메모는 필수가 아닙니다.

        **게시 버전 전환**

        - 같은 트랜잭션에서 항목 확인 → 초안의 immutable PUBLISHED 전환 → currentPublishedVersionId 교체 → 활성 초안 포인터 해제 → 알림 이벤트 outbox 저장을 수행합니다. 작업 실패 시 전체 rollback하고 기존 게시본을 유지합니다.
        - 게시본 content는 불변입니다. 수정은 새 인터뷰·새 초안 버전으로 진행하며 이전 게시본/평가/동의/인용 출처는 보존합니다. 게시 취소/버전 이력 관리 API는 후속 범위입니다.
        - 게시 시 사진 참조를 다시 검증합니다. 삭제/다른 매장 파일·잘못된 UUID/시간 참조가 있으면 422이며 게시하지 않습니다.
        - 같은 key는 최초 게시 결과를 재현합니다. 새 key로 이미 게시된 초안을 발행하면 현재 초안과 ID가 다르거나 현재 초안이 없으므로 409 MANUAL_VERSION_CONFLICT입니다. 재전송으로 버전을 복제하거나 추가 알림을 만들지 않습니다.
        - 알림 실제 전달 실패는 게시 완료를 rollback하지 않습니다. 향후 알림 기능에서 outbox를 재처리합니다. 공개 응답에는 점주 계정 ID·대화·미충족 항목·내부 평가를 포함하지 않습니다.

        **대상 초안 식별과 재시도**

        - expectedVersionId는 사용자가 조회·검토한 초안의 versionId이며 expectedRevision과 함께 필수입니다. 다른 초안에서 같은 revision 값이 재사용되어도 같은 리소스로 간주하지 않습니다.
        - 현재 역할·매장 소유권을 검사한 뒤 멱등성 결과를 확인합니다. 같은 key·같은 본문의 성공 재시도는 최초 결과만 재현하고 현재 초안에 작업을 다시 적용하지 않습니다. expectedVersionId도 정규화 body에 포함하므로 같은 key로 다른 버전을 보내면 409 IDEMPOTENCY_KEY_REUSED입니다.
        - 신규 요청은 매장 매뉴얼의 현재 초안 포인터를 잠그고 ID 비교·revision 비교·상태 검증·변경을 같은 트랜잭션에서 수행합니다. 현재 초안이 없거나 expectedVersionId와 다르면 revision이 같아도 409 MANUAL_VERSION_CONFLICT이며 내용·확인·게시 포인터·outbox를 변경하지 않습니다. ID가 일치한 뒤 revision이 다르면 409 REVISION_CONFLICT입니다. 게시·새 초안 생성도 같은 매뉴얼 잠금에 참여합니다.
        - 충돌 후 최신 초안을 다시 조회하되 이전 입력·확인 의사를 새 versionId에 자동 적용하지 않습니다. 사용자가 새 초안을 다시 검토한 후 그 versionId/revision과 새 key로 요청합니다. expectedVersionId 누락·null·UUID 형식 오류는 422 VALIDATION_ERROR입니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 해당 세션 또는 초안의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 이 요청은 작업을 예약하거나 파일을 저장하지 않고 DB 상태만 원자적으로 바꿉니다. 실패하면 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
        - 워커 작업은 입력 revision과 작업 ID를 확인해 성공 결과를 한 번만 적용합니다. 오래된 작업 결과는 현재 상태를 덮어쓰지 않습니다.

