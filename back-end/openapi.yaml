        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **탭과 정렬**

        - `view=ACTIVE`는 PENDING 중 현재 링크/접근 기간이 남아 있는 초대, `PAST`는 수락·거절·취소·만료 초대입니다.
        - PENDING의 두 기한 중 하나라도 `now >= 기한`이면 EXPIRED로 계산합니다. 배치 작업이 아직 상태를 변경하지 않아도 목록/건수에서 만료 처리합니다.
