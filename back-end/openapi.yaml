      summary: 매뉴얼 사진 보호 조회
      description: |-
        서버가 이미지를 proxy하여 반환합니다. OWNER는 소유 매장의 연결된 초안/인터뷰/게시본 사진을, WORKER는 현재 게시본이 참조하는 사진만 볼 수 있습니다. 음성 원본·미첨부 사진·삭제 파일은 조회하지 못합니다. 다른 매장 사진과 비공개 사진은 동일한 404 MANUAL_RESOURCE_NOT_FOUND입니다.

        인증 및 현재 권한을 byte 전송 전에 확인하며 Cache-Control: no-store와 X-Content-Type-Options: nosniff를 적용합니다. 사진 URL만 알아도 접근할 수 있는 공개 object URL은 제공하지 않습니다. 만료/종료 후 새 요청은 차단하나 이미 내려받은 byte는 회수할 수 없습니다.

        **OWNER**: ACTIVE 점주 세션·소유권·APPROVED를 확인합니다. **WORKER**: 아래 열람 권한을 확인합니다. 역할별로 서로 다른 리소스 범위를 적용합니다.

        **열람 권한**

        - 가입 완료된 ACTIVE WORKER 세션과 이 매장의 현재 유효한 `READ_MANUALS` 접근이 필요합니다.
        - 정기/대타 중 하나라도 시작 시각 이상이고 만료 시각 미만이며 수동 종료되지 않았으면 허용합니다. 현재 시각이 종료 시각과 같아도 차단합니다.
        - 요청마다 회원 상태·APPROVED·유효 접근을 확인합니다. 다른 역할/정지는 403, 매장 승인 중단은 403 STORE_APPROVAL_REQUIRED입니다.
        - 존재하지 않는 매장과 접근 권한 없는 매장은 같은 **404 STORE_NOT_FOUND**입니다. 요청한 섹션/사진은 현재 게시 버전에 속해야 합니다.
        - 게시 전 초안·점주 대화·평가·비공개 음성은 반환하지 않습니다. 응답은 Cache-Control: no-store입니다.

