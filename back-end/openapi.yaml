      operationId: listMyNotifications
      summary: 전체·안 읽은 알림과 안 읽음 건수
      description: |-
        가입 완료된 ACTIVE OWNER 또는 WORKER 세션이 필요합니다. 알림은 세션 회원 본인만 접근합니다.

        read=ALL/UNREAD 필터, 최신 생성순(createdAt DESC,id DESC). unreadCount는 필터/페이지와 무관한 본인 전체 미열람 건수이며 asOf와 같은 시점입니다. 빈 목록은 200 items=[]입니다. target은 내부 리소스 종류/ID만 담고 외부 URL·초대 토큰을 포함하지 않습니다. 알림 조회만으로 읽음 처리하지 않습니다. target 페이지 API는 현재 권한을 다시 검증하며 초대/근무 만료 후 오래된 알림을 눌러도 접근이 복구되지 않습니다.

        신규 지원·초대 수락·매장 승인·초대 만료·근무 요청·1시간 미응답·근무 확정·근무 전날 안내·게시 매뉴얼 갱신을 domain transaction outbox로 발행합니다. 이벤트 ID+수신자 유일성으로 재처리 중복을 방지합니다. 앱 내부 알림이며 외부 push 등록 API는 이번 화면에 없습니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        점주 요청 철회는 WORK_REQUEST_WITHDRAWN, 확정 철회는 WORK_CONFIRMATION_WITHDRAWN으로 당사자에게 발행하며 target=WORK_REQUEST로 과거 요청 상태를 조회합니다. 수락/철회 트랜잭션 outbox와 이벤트+수신자 유일성을 적용합니다. 확정 철회 알림은 취소 일정으로 이동하지 않습니다. WORK_SCHEDULE은 workDate(서울 근무 시작일)로 월별 전체 캘린더를 조회하고 eventId를 강조합니다. 점주는 storeId 필터를 사용할 수 있습니다. 과거 확정 알림의 일정이 철회되어 없어졌다면 철회 안내를 표시하며 접근을 복구하지 않습니다.
