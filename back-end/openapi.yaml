        상세 추가 버튼은 Figma에 없어 제안 API입니다. APPROVED 매장만 저장하며 이미 저장했으면 최초 savedAt을 유지하고 200 현재 결과를 반환합니다. 회원+매장 유일성을 적용하고 관심 저장은 자료 접근 권한이나 지원을 생성하지 않습니다.

