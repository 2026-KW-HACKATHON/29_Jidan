  /api/stores/{storeId}/invitations:
    post:
      tags:
      - 근무자 초대
      operationId: createStoreInvitation
      summary: 근무자 초대와 메일 발송 요청
      description: |-
        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **초대 생성**

        - 검증된 Google 계정과 일치할 대상 이메일을 입력합니다. 이메일을 정규화해 비교하며 점/plus 별칭으로 다른 주소를 자동 통합하지 않습니다.
        - 대상이 아직 가입하지 않아도 초대할 수 있지만 수락은 가입 완료 WORKER만 가능합니다. 점주 자신의 검증 이메일은 **422**입니다.
        - `accessExpiresAt`은 선택입니다. 생략/null이면 점주가 직접 종료할 때까지, 값이 있으면 해당 시각까지 자료 접근을 허용합니다. 지정 시각은 현재보다 미래여야 합니다.
        - 접근 종료는 매장 자료 접근 종료이며 고용 계약 종료를 뜻하지 않습니다. 점주는 기간과 무관하게 나중에 직접 종료할 수 있습니다.
        - 링크는 생성 후 **7일**입니다. 접근 종료가 더 빠르면 그 이후 수락도 **410 ACCESS_PERIOD_ENDED**입니다.
        - 같은 매장/이메일의 유효 초대와 이미 유효한 매장 자료 접근은 각각 **409**입니다. 과거 초대/종료된 접근만 있으면 새로 초대할 수 있습니다.
        - 메일 outbox와 초대를 한 트랜잭션으로 저장한 뒤 **201**, `deliveryStatus=QUEUED`를 반환합니다. 실제 이메일 발송·수신 완료는 보장하지 않습니다. 실패 시 **503**과 전체 rollback입니다.
        - UUID `Idempotency-Key`는 필수이며 같은 key/body의 재시도는 최초 결과를 재현하고 중복 메일 요청을 만들지 않습니다.

        **링크 토큰**

        - 서버가 256bit 이상의 일회용 불투명 토큰을 생성하고 hash만 저장합니다. 메일은 서버가 고정한 frontend origin의 fragment로 토큰을 전달합니다. 임의 URL은 받지 않습니다.
        - 프론트는 fragment를 읽어 history에서 제거하고 body로만 제출합니다. token/초대 링크는 API 응답·URL query·로그·분석·오류에서 제외합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.
