  /api/auth/registrations/owners:
    post:
      tags:
      - 가입
      operationId: registerOwner
      summary: 점주 가입 및 최초 매장 승인 신청
      security:
      - RegistrationCookie: []
        CsrfToken: []
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: |-
        **요청 조건**

        - Google 가입 세션 + X-CSRF-Token + 허용된 Origin 필요. 역할과 이메일은 서버가 결정한다.
        - 가입 세션일 때만 새 회원 생성 가능. 회원 세션은 동일 주체의 성공한 Idempotency-Key 재시도만 허용하며 그 외 409 ALREADY_REGISTERED.
        - Origin은 허용 목록의 정확한 scheme/host/port로 검증하며 임의 Origin/누락은 403 CSRF_INVALID.

        **저장과 재시도**

        - 가입/프로필(점주는 매장 포함) 저장과 key 결과 기록은 같은 트랜잭션. 성공 후 가입 세션을 폐기하고 회원 세션으로 교체.
        - 실패 시 입력값 유지. 같은 key와 본문으로 재시도하면 중복 저장 없이 최초 201 결과 재현.

        **매장 신청과 승인**

        - 승인 상태는 서버가 `PENDING`으로 설정합니다.
        - 점주 권한과 승인된 매장의 운영 권한을 분리합니다.
        - 중복 매장: **409 · `STORE_ALREADY_REGISTERED`**
        - 월계1동 외 소재지: **422 · `STORE_OUTSIDE_SERVICE_AREA`**
      requestBody:
        required: true
        content:
