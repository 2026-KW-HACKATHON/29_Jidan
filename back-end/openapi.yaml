                pendingOwner:
                  summary: 매장 운영 승인 대기 점주
                  value:
                    user:
                      id: 24b9e7af-90fd-424b-9eb3-0b65cda88b2f
                      role: OWNER
                      name: 김민수
                      identity:
                        provider: GOOGLE
