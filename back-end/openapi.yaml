openapi: 3.1.0
info:
  title: 지단 인증·매장 승인 API 설계 명세
  version: 0.2.0
  description: |-
    Figma 로그인·가입, 일반회원 등록, 점주 가입과 관리자 매장 승인을 위한 구현 전 계약입니다.

    실제 API/OAuth/DB는 구현되지 않았으며 로컬 문서 서버에서는 요청 실행을 지원하지 않습니다.

    Google 이메일은 검증된 Google ID token에서 서버가 가져오고 요청 본문으로 받지 않습니다.

    일반 회원 인증은 브라우저의 동일 출처 /api 프록시와 opaque HttpOnly 세션 쿠키를 사용합니다.

    관리자 매장 승인 API는 요청 JSON body의 password로 매 요청 인증합니다.

    state·nonce, 세션 만료 시간, 쿠키 방식과 오류 정책은 화면에 없는 설계 제안입니다.

    로그인 시작 → Google callback → 기존 회원은 세션, 신규 회원은 10분 가입 세션 → 가입 완료 순서입니다.

    일반 회원의 비밀번호 로그인/이메일 인증/비밀번호 재설정은 이 화면 범위에 없습니다.

    모든 응답에는 Cache-Control: no-store를 적용하고 세션/개인정보를 로그에 남기지 않습니다.
  contact:
    name: Jidan 팀
    url: https://github.com/2026-KW-HACKATHON/29_Jidan
  license:
    name: 프로젝트 내부 설계 문서
    url: https://github.com/2026-KW-HACKATHON/29_Jidan
servers:
- url: http://127.0.0.1:8000
  description: 향후 로컬 API 구현 서버 (5500은 문서 전용)
tags:
- name: Google 인증
  description: Google 계정으로 로그인 또는 최초 가입 시작
- name: 가입
  description: Google 인증 이후 가입 컨텍스트 및 일반회원·점주 등록
- name: 세션
  description: 현재 사용자와 권한 조회, CSRF 토큰 발급 및 로그아웃
- name: 매장 승인 관리
  description: 요청 body의 관리자 password로 신청을 전체 조회하고 승인 처리
- name: 일반회원 프로필
  description: 로그인한 일반회원의 프로필 조회 및 기본 정보·경력·가능 시간 수정
security:
- SessionCookie: []
externalDocs:
  description: 기준 Figma Design 페이지
  url: https://www.figma.com/design/ZaFHresnBXJ1h98Xl1AUDj?node-id=0-1
paths:
  /api/auth/google:
    get:
      tags:
      - Google 인증
      operationId: startGoogleLogin
      summary: Google 로그인 시작
      security: []
      description: |-
        Google 버튼에서 페이지 이동으로 호출하며, Google OAuth authorization URL로 **302** 응답합니다.

        **로그인 트랜잭션**

        - 서버는 5분 일회용 `state`·`nonce`와 브라우저 바인딩 트랜잭션을 생성합니다.
        - `jidan_oauth` 쿠키를 설정하고 callback에서 폐기합니다.
        - 쿠키 속성: `HttpOnly; Secure; SameSite=Lax; Path=/api/auth/google`

        **인증 설정**

        - Google scope: `openid email profile`
        - `redirect_uri`: 서버에 설정된 callback URI만 사용합니다.
        - `state`는 서버가 생성하며 클라이언트가 지정할 수 없습니다. 외부 `returnUrl`은 받지 않습니다.
        - 기존 유효 세션은 callback 전까지 유지하고, 인증 성공 후 세션 ID를 회전합니다.
      responses:
        '302':
          description: Google 인증 화면으로 이동
          headers:
            Location:
              description: 고정된 프론트엔드 경로 또는 Google authorization URL. 임의 redirect URL을 입력받지 않음. 인증 토큰은
                URL에 포함하지 않음.
              schema:
                type: string
                format: uri
              example: http://127.0.0.1:5184/__auth/signup
            Set-Cookie:
              description: 일회용 OAuth 브라우저 바인딩 쿠키
              schema:
                type: string
              example: jidan_oauth=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/google; Max-Age=300
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/google/callback:
    get:
      tags:
      - Google 인증
      operationId: completeGoogleLogin
      summary: Google 인증 결과 처리 및 기존/신규 분기
      security: []
      description: |-
        Google이 호출하는 브라우저 callback입니다.

        **검증 순서**

        1. `state`와 `jidan_oauth`의 바인딩·만료·일회성을 검증한 뒤 `code`를 교환합니다.
        2. `code` 또는 `error` 중 정확히 하나가 필요합니다. 동시 제공·누락·중복 query parameter는 **400**입니다.
        3. ID token의 서명·`iss`·`aud`·`exp`·`nonce`·`email_verified`를 검증합니다.
        4. `provider=GOOGLE`과 `sub`로 회원을 찾습니다.

        **인증 결과에 따른 이동**

        - **기존 ACTIVE 회원**: 새 회원 세션을 발급하고 가입 세션을 삭제합니다.
          이동 경로: `http://127.0.0.1:5184/__auth/session`
        - **신규 주체**: 가입 세션을 발급하고 기존 회원 세션을 삭제합니다.
          이동 경로: `http://127.0.0.1:5184/__auth/signup`
        - **동의 취소** (`error=access_denied`): 로그인 화면으로 **302** 이동하며 공개 오류 코드 `GOOGLE_ACCESS_DENIED`만 전달합니다.

        이 경로는 프론트엔드 구현 시 확정할 제안입니다. 운영 frontend origin은 서버 설정값을 사용합니다.

        **오류 응답**

        | 상황 | HTTP 상태 | 오류 코드 |
        | --- | --- | --- |
        | state 오류 | 400 | `OAUTH_STATE_INVALID` |
        | code 재사용 | 400 | `OAUTH_CODE_INVALID` |
        | ID token 검증 실패 | 401 | `GOOGLE_IDENTITY_INVALID` |
        | 정지 계정 | 403 | `ACCOUNT_SUSPENDED` |

        **오류 처리와 정보 보호**

        - `state`는 Google error 응답에서도 필수입니다.
        - 오류 시 새 세션을 발급하지 않고 트랜잭션을 폐기합니다.
        - 원시 `code`, ID token, Google `error_description`은 프론트 URL·응답·로그에 노출하지 않습니다.
      parameters:
      - name: state
        in: query
        required: true
        description: 서버가 생성한 OAuth state. 쿠키의 로그인 트랜잭션과 비교.
        schema:
          type: string
          minLength: 32
          maxLength: 512
        example: example_state_value_0123456789abcdef
      - name: code
        in: query
        description: Google 일회용 authorization code. error와 상호 배타.
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: error
        in: query
        description: Google OAuth 오류. code와 상호 배타.
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: access_denied
      - name: jidan_oauth
        in: cookie
        required: true
        description: 로그인 시작에서 설정한 브라우저 바인딩 쿠키. 누락·만료·state 불일치는 400.
        schema:
          type: string
          minLength: 1
      responses:
        '302':
          description: 기존 회원/신규 가입/동의 취소에 따라 프론트엔드로 이동
          headers:
            Location:
              description: 고정된 프론트엔드 경로 또는 Google authorization URL. 임의 redirect URL을 입력받지 않음. 인증 토큰은
                URL에 포함하지 않음.
              schema:
                type: string
                format: uri
              example: http://127.0.0.1:5184/__auth/signup
            Set-Cookie:
              description: |-
                가입 세션을 설정.

                운영에서는 Secure, 로컬 HTTP에서만 Secure 생략.

                callback 오류 시 login 트랜잭션 쿠키 폐기.

                기존 회원이면 대신 jidan_session 설정.

                각각 별도 Set-Cookie 헤더로 전달.
              schema:
                type: string
              example: jidan_registration=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth; Max-Age=600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/registration:
    get:
      tags:
      - 가입
      operationId: getRegistrationContext
      summary: 최초 가입의 Google 이메일·가능한 가입 유형 조회
      security:
      - RegistrationCookie: []
      description: |-
        가입 유형 선택·등록 화면에 진입할 때 호출합니다.

        - 가입 컨텍스트의 `email`은 읽기 전용입니다.
        - 회원 세션만 있으면 **403 · `ALREADY_REGISTERED`**입니다.
        - 가입 세션이 만료되면 입력값을 로컬에서 유지한 채 Google 로그인을 다시 시도합니다.
      responses:
        '200':
          description: Google 인증 이후 가입 전 컨텍스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationContext'
              example:
                identity:
                  provider: GOOGLE
                  email: member@example.com
                  emailVerified: true
                expiresAt: '2026-10-02T10:10:00Z'
                allowedRoles:
                - WORKER
                - OWNER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/registrations/workers:
    post:
      tags:
      - 가입
      operationId: registerWorker
      summary: 일반회원 프로필 등록 및 가입 완료
      security:
      - RegistrationCookie: []
        CsrfToken: []
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: |-
        **요청 조건**

        - Google 가입 세션 + X-CSRF-Token + 허용된 Origin 필요. 역할과 이메일은 서버가 결정한다.
        - 가입 세션일 때만 새 회원 생성 가능. 회원 세션은 동일 주체의 성공한 Idempotency-Key 재시도만 허용하며 그 외 409 ALREADY_REGISTERED.
        - Origin은 허용 목록의 정확한 scheme/host/port로 검증하며 임의 Origin/누락은 403 CSRF_INVALID.

        **저장과 재시도**

        - 가입/프로필(점주는 매장 포함) 저장과 key 결과 기록은 같은 트랜잭션. 성공 후 가입 세션을 폐기하고 회원 세션으로 교체.
        - 실패 시 입력값 유지. 같은 key와 본문으로 재시도하면 중복 저장 없이 최초 201 결과 재현.

        **근무 프로필 검증**

        - 신입은 `careers=[]`, 경력은 최소 1건이 필요합니다.
        - 현재 근무 중이면 `endMonth=null`입니다.
        - 생일·경력 연월 순서·가능 시간 중첩은 서버에서 검증합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistrationRequest'
            examples:
              newWorker:
                summary: 신입 · 월/수/금 주간 근무
                value:
                  name: 김지수
                  phoneNumber: '01012345678'
                  birthDate: '2001-03-14'
                  gender: FEMALE
                  experienceLevel: NEW
                  careers: []
                  availabilities:
                  - days:
                    - MON
                    - WED
                    - FRI
                    startTime: 09:00
                    endTime: '14:00'
                    endsNextDay: false
              currentCareerNight:
                summary: 경력 · 현재 근무 중 · 심야 가능 시간
                value:
                  name: 김지수
                  phoneNumber: '01012345678'
                  birthDate: '2001-03-14'
                  gender: FEMALE
                  experienceLevel: EXPERIENCED
                  careers:
                  - industry: CAFE
                    duties: 음료 제조, 고객 응대
                    startMonth: 2024-03
                    endMonth: null
                    isCurrent: true
                  availabilities:
                  - days:
                    - FRI
                    - SUN
                    startTime: '22:00'
                    endTime: 02:00
                    endsNextDay: true
      responses:
        '201':
          description: 가입 완료 및 새 회원 세션 발급. 동일 key 재시도도 최초 201 응답 재현.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                user:
                  id: a7be5b17-30d8-4b47-bd75-e866b4539dc9
                  role: WORKER
                  name: 김지수
                  identity:
                    provider: GOOGLE
                    email: member@example.com
                    emailVerified: true
                  phoneNumber: '01012345678'
                  profileCompleted: true
                  permissions:
                  - BROWSE_JOB_POSTINGS
                  - APPLY_FOR_JOBS
                  - READ_OWN_PROFILE
                  stores: []
                expiresAt: '2026-10-03T10:00:00Z'
                nextAction: WORKER_HOME
          headers:
            Set-Cookie:
              description: |-
                jidan_session을 설정하고 jidan_registration을 Max-Age=0으로 삭제.

                별도 Set-Cookie 헤더 사용.

                기존 쿠키와 CSRF 토큰을 회전.

                운영에서 Secure, 로컬 HTTP에서만 Secure 생략.
              schema:
                type: string
              example: jidan_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/registrations/owners:
    post:
      tags:
      - 가입
      operationId: registerOwner
      summary: 점주 가입 및 최초 매장 승인 신청
      security:
      - RegistrationCookie: []
        CsrfToken: []
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: |-
        **요청 조건**

        - Google 가입 세션 + X-CSRF-Token + 허용된 Origin 필요. 역할과 이메일은 서버가 결정한다.
        - 가입 세션일 때만 새 회원 생성 가능. 회원 세션은 동일 주체의 성공한 Idempotency-Key 재시도만 허용하며 그 외 409 ALREADY_REGISTERED.
        - Origin은 허용 목록의 정확한 scheme/host/port로 검증하며 임의 Origin/누락은 403 CSRF_INVALID.

        **저장과 재시도**

        - 가입/프로필(점주는 매장 포함) 저장과 key 결과 기록은 같은 트랜잭션. 성공 후 가입 세션을 폐기하고 회원 세션으로 교체.
        - 실패 시 입력값 유지. 같은 key와 본문으로 재시도하면 중복 저장 없이 최초 201 결과 재현.

        **매장 신청과 승인**

        - 승인 상태는 서버가 `PENDING`으로 설정합니다.
        - 점주 권한과 승인된 매장의 운영 권한을 분리합니다.
        - 중복 매장: **409 · `STORE_ALREADY_REGISTERED`**
        - 월계1동 외 소재지: **422 · `STORE_OUTSIDE_SERVICE_AREA`**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRegistrationRequest'
            example:
              name: 김민수
              phoneNumber: '01012345678'
              store:
                name: 명랑핫도그 광운대점
                industry: RESTAURANT
                postalCode: '01897'
                address: 서울특별시 노원구 광운로 20
                detailAddress: 1층
                businessRegistrationNumber: '1234567890'
                phoneNumber: '029123456'
      responses:
        '201':
          description: 가입 완료 및 새 회원 세션 발급. 동일 key 재시도도 최초 201 응답 재현.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                user:
                  id: 24b9e7af-90fd-424b-9eb3-0b65cda88b2f
                  role: OWNER
                  name: 김민수
                  identity:
                    provider: GOOGLE
                    email: owner@example.com
                    emailVerified: true
                  phoneNumber: '01012345678'
                  profileCompleted: true
                  permissions:
                  - READ_OWN_STORE_STATUS
                  stores:
                  - storeId: 51c1c743-d377-4e7a-8449-94377eecfce0
                    storeName: 명랑핫도그 광운대점
                    approvalStatus: PENDING
                    permissions:
                    - READ_STORE_STATUS
                expiresAt: '2026-10-03T10:00:00Z'
                nextAction: OWNER_APPROVAL_PENDING
          headers:
            Set-Cookie:
              description: |-
                jidan_session을 설정하고 jidan_registration을 Max-Age=0으로 삭제.

                별도 Set-Cookie 헤더 사용.

                기존 쿠키와 CSRF 토큰을 회전.

                운영에서 Secure, 로컬 HTTP에서만 Secure 생략.
              schema:
                type: string
              example: jidan_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/session:
    get:
      tags:
      - 세션
      operationId: getCurrentSession
      summary: 현재 회원·가입 완료 상태·역할·매장 권한 조회
      description: |-
        새로고침·로그인 완료 후 화면 이동을 결정할 때 사용합니다. 매장 승인 변경은 현재 DB 상태를 반영합니다.

        **세션 오류**

        - 가입 전 세션: **401 · `REGISTRATION_REQUIRED`**
        - 정지 계정: **403 · `ACCOUNT_SUSPENDED`**, 세션 폐기

        **점주 화면 이동**

        - `PENDING` 매장만 있는 경우: `nextAction=OWNER_APPROVAL_PENDING`
        - 승인된 매장이 하나라도 있는 경우: `nextAction=OWNER_HOME`
      responses:
        '200':
          description: 로그인한 회원과 현재 권한
          content:
            application/json:
              schema:
