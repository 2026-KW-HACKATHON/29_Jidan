        createdAt:
          type: string
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
        revision:
          type: integer
          minimum: 1
        myApplicationId:
          type:
          - string
          - 'null'
          format: uuid
        canApply:
          type: boolean
        cannotApplyReason:
          oneOf:
          - type: string
            enum:
            - JOB_CLOSED
            - JOB_STARTED
            - ALREADY_APPLIED
            - ALREADY_CONFIRMED
            - JOB_FILLED
          - type: 'null'
        matchesAvailability:
          type: boolean
          description: 등록 가능 시간의 합집합이 실제 근무 [startAt,endAt) 전체를 덮으면 true입니다. 일부만 겹치거나 등록 시간이 없으면 false입니다.
      required:
      - title
      - description
      - workPart
      - workDate
      - startTime
      - endTime
      - endsNextDay
      - minimumExperience
      - experienceNotes
      - hourlyPay
      - paymentTiming
      - paymentNotes
      - id
      - store
      - status
      - recruitmentCount
      - applicantCount
      - startAt
      - endAt
      - estimatedPay
      - createdAt
      - closedAt
      - revision
      - myApplicationId
      - canApply
      - cannotApplyReason
      - matchesAvailability
      oneOf:
      - properties:
          canApply:
            const: true
          status:
            const: RECRUITING
          cannotApplyReason:
            type: 'null'
          myApplicationId:
            type: 'null'
        required:
        - canApply
        - status
        - cannotApplyReason
        - myApplicationId
      - properties:
          canApply:
            const: false
          cannotApplyReason:
            type: string
            enum:
            - JOB_CLOSED
            - JOB_STARTED
            - ALREADY_APPLIED
            - ALREADY_CONFIRMED
            - JOB_FILLED
        required:
        - canApply
        - cannotApplyReason
      allOf:
      - if:
          properties:
            cannotApplyReason:
              type: string
              enum:
              - ALREADY_APPLIED
              - ALREADY_CONFIRMED
          required:
          - cannotApplyReason
        then:
          properties:
            myApplicationId:
              type: string
              format: uuid
      - if:
          properties:
            status:
              const: CLOSED
          required:
          - status
        then:
          properties:
            canApply:
              const: false
      description: 시간 일치(true 먼저), 동일 일치 여부 안에서는 startAt ASC,id ASC로 정렬한 홈 추천 카드입니다. 추천은 지원 가능 여부를 대체하지 않습니다.
    ManualDraftCorrectionTarget:
      type: object
      additionalProperties: false
      properties:
        kind:
          enum:
          - MANUAL
          - SHIFT
          - SECTION
        targetId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - kind
      - targetId
      oneOf:
      - properties:
          kind:
            const: MANUAL
          targetId:
            type: 'null'
        type: object
        required:
        - kind
        - targetId
      - properties:
          kind:
            enum:
            - SHIFT
            - SECTION
          targetId:
            type: string
            format: uuid
        type: object
        required:
        - kind
        - targetId
    ManualDraftCorrectionInput:
      type: object
      additionalProperties: false
      properties:
        expectedVersionId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 1
        target:
          $ref: '#/components/schemas/ManualDraftCorrectionTarget'
        input:
          oneOf:
          - $ref: '#/components/schemas/ManualInterviewInput'
          - $ref: '#/components/schemas/ManualMediaWritingSource'
      required:
      - expectedVersionId
      - expectedRevision
      - target
      - input
      if:
        properties:
          input:
            properties:
              method:
                const: MEDIA
            required:
            - method
        required:
        - input
      then:
        properties:
          target:
            properties:
              kind:
                const: SECTION
    ManualMediaWritingSource:
      type: object
      additionalProperties: false
      description: 초안 정정의 입력 방식 MEDIA(0.12.0). 말 대신 target 섹션에 연결된 사진·영상을 AI가 보고 그 섹션의 단계를 작성·보강합니다. target.kind=SECTION만 허용합니다.
      properties:
        method:
          const: MEDIA
      required:
      - method
    ManualMediaWritingRequest:
      type: object
      additionalProperties: false
      description: 검토 섹션의 사진·영상 기반 작성 요청(0.12.0).
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        sectionId:
          type: string
          format: uuid
          description: 이 검토 content.sections의 섹션 ID. 사진 또는 영상이 하나 이상 연결되어 있어야 합니다.
      required:
      - expectedRevision
      - sectionId
    ManualDraftCorrectionRetry:
      type: object
      additionalProperties: false
      properties:
        expectedVersionId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - expectedVersionId
      - expectedRevision
    ManualDraftCorrectionError:
      type: object
      additionalProperties: false
      properties:
        code:
          enum:
          - AI_PROCESSING_FAILED
          - CORRECTION_CLARIFICATION_REQUIRED
          - MANUAL_REFERENCE_CONFLICT
          - MANUAL_VERSION_CONFLICT
          - REVISION_CONFLICT
        message:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      oneOf:
      - properties:
          code:
            const: AI_PROCESSING_FAILED
          retryable:
            const: true
        type: object
        required:
        - code
        - retryable
      - properties:
          code:
            enum:
            - CORRECTION_CLARIFICATION_REQUIRED
            - MANUAL_REFERENCE_CONFLICT
            - MANUAL_VERSION_CONFLICT
            - REVISION_CONFLICT
          retryable:
            const: false
        type: object
        required:
        - code
        - retryable
    ManualDraftCorrection:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        baseRevision:
          type: integer
          minimum: 1
        target:
          $ref: '#/components/schemas/ManualDraftCorrectionTarget'
        status:
          enum:
          - RUNNING
          - SUCCEEDED
          - ERROR
        attempt:
          type: integer
          minimum: 1
        resultRevision:
          type:
          - integer
          - 'null'
          minimum: 1
        error:
          oneOf:
          - $ref: '#/components/schemas/ManualDraftCorrectionError'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - versionId
      - baseRevision
      - target
      - status
      - attempt
      - resultRevision
      - error
      - createdAt
      - completedAt
      oneOf:
      - properties:
          status:
            const: RUNNING
          resultRevision:
            type: 'null'
          error:
            type: 'null'
          completedAt:
            type: 'null'
        type: object
        required:
        - status
        - resultRevision
        - error
        - completedAt
      - properties:
          status:
            const: SUCCEEDED
          resultRevision:
            type: integer
            minimum: 1
          error:
            type: 'null'
          completedAt:
            type: string
            format: date-time
        type: object
        required:
        - status
        - resultRevision
        - error
        - completedAt
      - properties:
          status:
            const: ERROR
          resultRevision:
            type: 'null'
          error:
            $ref: '#/components/schemas/ManualDraftCorrectionError'
          completedAt:
            type: string
            format: date-time
        type: object
        required:
        - status
        - resultRevision
        - error
        - completedAt
  responses:
    AdminPasswordUnauthorized:
      description: 관리자 비밀번호가 일치하지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ADMIN_PASSWORD_INVALID
            message: 관리자 인증에 실패했습니다.
            requestId: req_example_001
            fieldErrors: []
    BadRequest:
      description: 콜백 파라미터 누락·중복·불일치 또는 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: 콜백 파라미터 누락·중복·불일치 또는 잘못된 요청
            requestId: req_example_001
            fieldErrors: []
    Unauthorized:
      description: 세션이 없거나 만료·폐기됨. Google 로그인부터 다시 시작
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SESSION_EXPIRED
            message: 세션이 없거나 만료·폐기됨. Google 로그인부터 다시 시작
            requestId: req_example_001
            fieldErrors: []
    Forbidden:
      description: 세션 종류/역할 불일치, 정지 계정, CSRF/Origin 불일치 또는 매장 권한 부족
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 세션 종류/역할 불일치, 정지 계정, CSRF/Origin 불일치 또는 매장 권한 부족
            requestId: req_example_001
            fieldErrors: []
    Conflict:
      description: 이미 가입된 Google 주체, 중복 사업자 번호 또는 Idempotency-Key 재사용 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: REGISTRATION_CONFLICT
            message: 이미 가입된 Google 주체, 중복 사업자 번호 또는 Idempotency-Key 재사용 충돌
            requestId: req_example_001
            fieldErrors: []
    Unprocessable:
      description: 필드 형식·날짜·경력·가능 시간 또는 월계1동 소재지 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 필드 형식·날짜·경력·가능 시간 또는 월계1동 소재지 검증 실패
            requestId: req_example_001
            fieldErrors: []
    TooManyRequests:
      description: 과도한 요청. Retry-After 초 이후 재시도
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: 과도한 요청. Retry-After 초 이후 재시도
            requestId: req_example_001
            fieldErrors: []
      headers:
        Retry-After:
          description: 재시도까지 남은 초
          schema:
            type: integer
            minimum: 1
          example: 60
    BadGateway:
      description: Google 코드 교환/ID token 조회 일시 실패. 로그인부터 재시도
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: GOOGLE_UNAVAILABLE
            message: Google 코드 교환/ID token 조회 일시 실패. 로그인부터 재시도
            requestId: req_example_001
            fieldErrors: []
    InternalError:
      description: 처리 실패. requestId와 함께 문의. 가입 트랜잭션은 전부 rollback
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: 처리 실패. requestId와 함께 문의. 가입 트랜잭션은 전부 rollback
            requestId: req_example_001
            fieldErrors: []
