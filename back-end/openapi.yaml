  /api/stores/{storeId}/manual/media:
    post:
      tags:
      - 매뉴얼 미디어
      operationId: uploadManualMedia
      summary: 사진·영상·인터뷰 음성 업로드
      description: |-
        multipart/form-data의 purpose와 file을 제출합니다. 승인된 본인 매장의 파일만 만들 수 있습니다.

        **영상 (0.12.0, MANUAL_VIDEO)**

        - MP4(H.264/HEVC)·QuickTime(MOV)·WebM, 최대 100 MiB 및 60초입니다. 사진·음성과 같은 413/415/422 규칙으로 실제 byte를 검사합니다.
        - 업로드 성공 시 서버가 대표 프레임 한 장을 뽑아 별도의 사진(MANUAL_PHOTO와 같은 형식)으로 저장하고 posterMediaId로 돌려줍니다. 영상은 AI 작성 입력으로만 쓰고 근무자에게는 대표 프레임 사진만 보여 줍니다.
        - 영상은 검토 사진 교체(PUT review/photos)와 초안 content의 사진 항목에 mediaId로 연결합니다. 인터뷰 답변 photoIds에는 연결할 수 없습니다(422).
        - 영상 원본은 사진·영상 기반 작성(review/media-writing, 초안 정정 MEDIA)을 접수할 때 24시간 보관을 연장하고 이후 보관 정리 대상입니다. 원본이 정리된 뒤에도 연결과 대표 프레임 사진은 유지되며, 다시 작성하면 대표 프레임만 입력으로 씁니다.

        **파일 검증·보관 (설계 제안)**

        - 사진은 JPEG/PNG/WebP, 최대 10 MiB; 음성은 MPEG/MP4/WebM/WAV, 최대 20 MiB 및 120초입니다. 정확히 상한은 허용합니다.
        - 확장자나 클라이언트 MIME을 신뢰하지 않고 실제 signature·디코딩·크기·음성 길이를 확인합니다. 잘못된 파일은 422 MEDIA_INVALID, 미지원 MIME은 415 UNSUPPORTED_MEDIA_TYPE, 상한 초과는 413 MEDIA_TOO_LARGE입니다.
        - MANUAL_PHOTO는 정지 사진만 허용하며 이미지의 EXIF 위치 정보는 제거합니다. SVG·HTML·임의 URL은 받지 않고 영상은 MANUAL_VIDEO로만 받습니다. 처리 한도/디코더 보호는 구현 시 적용합니다.
        - 성공 시 비공개 mediaId만 반환합니다. 파일 경로·object key·외부 URL·signed URL을 노출하지 않습니다.
        - 사진 첨부는 초안의 photos 배열 또는 인터뷰 답변의 photoIds를 통해 연결합니다. 다른 매장 파일과 음성 파일의 사진 연결은 거절합니다.
        - 미첨부 파일은 24시간 뒤 정리합니다. 연결된 초안/게시본 사진은 해당 버전 보존 중 유지합니다. 음성 원본은 전사 종료 후 24시간 이내 정리하고 답변/전사 텍스트를 보존합니다.
        - 파일 저장과 metadata 기록을 함께 완료한 뒤 201입니다. 중간 실패에는 orphan 정리 작업을 예약합니다. 실패/유효성 거절은 멱등 결과로 고정하지 않습니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 해당 세션 또는 초안의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 상태 갱신·작업 예약·outbox 저장은 원자적입니다. 예약 실패는 **503 JOB_QUEUE_UNAVAILABLE**이며 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
        - 워커 작업은 입력 revision과 작업 ID를 확인해 성공 결과를 한 번만 적용합니다. 오래된 작업 결과는 현재 상태를 덮어쓰지 않습니다.
