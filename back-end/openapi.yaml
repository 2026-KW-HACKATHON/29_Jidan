                requestId: req_chapter_100
                fieldErrors: []
        '404':
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESOURCE_NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                requestId: req_chapter_100
                fieldErrors: []
        '422':
          description: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '409':
          description: WORK_REQUEST_EXPIRED, WORK_REQUEST_NOT_PENDING, WORK_REQUEST_REVISION_CONFLICT, JOB_FILLED,
            JOB_CLOSED, APPLICATION_WITHDRAWN, WORK_INTERVAL_CONFLICT. 동시에 수락/철회/마감한 경우 첫 성공만 적용합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STATE_CONFLICT
