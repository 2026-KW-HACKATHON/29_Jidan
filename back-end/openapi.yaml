  /api/users/me/profile/availabilities:
    put:
      tags:
      - 일반회원 프로필
      operationId: replaceMyWorkerAvailabilities
      summary: 내 일반회원 가능 시간 전체 교체
      security:
      - SessionCookie: []
        CsrfToken: []
      description: |-
        **인증·인가**

        - 가입이 완료된 ACTIVE `WORKER`의 `jidan_session` 쿠키가 필요합니다.
        - 가입 세션만으로는 사용할 수 없으며 **401 REGISTRATION_REQUIRED**입니다.
        - 점주 등 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 대상 회원은 세션에서 결정합니다. 다른 회원의 ID를 입력받지 않습니다.
        - Google 이메일은 읽기 전용이며 서버가 검증한 값만 반환합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **가능 시간 교체**

        - `availabilities` 목록만 전송하며 기존 목록을 통째로 교체합니다. 빠진 구간은 삭제하고 요청 순서를 유지합니다.
        - 최소 1건·최대 100건은 기존 가입 계약을 따른 설계 제안입니다. 모든 시간을 비우는 요청은 **422**입니다.
        - 각 구간에 요일 목록·시작/종료 시각·`endsNextDay`를 모두 보냅니다. 30분 단위의 Asia/Seoul 주간 반복 일정입니다.
        - `endsNextDay=false`이면 종료>시작, true이면 종료<=시작이며 **0<기간<=24시간**이어야 합니다. 서버에서 검증합니다.
        - 자정은 `24:00` 대신 `00:00`과 `endsNextDay=true`로 표현합니다. 예: 금요일 22:00 → 토요일 00:00.

        **중첩 검증**

        - 요일 목록을 각 요일 구간으로 펼친 뒤 기존 목록이 아닌 제출된 전체 목록의 중첩을 검사합니다. 같은 요일·다음 날·주 경계를 모두 포함합니다.
        - 일요일 심야는 다음 월요일로 이어집니다. 예: 일요일 22:00~월요일 02:00과 월요일 01:00~03:00은 **422**입니다.
        - 시작은 포함하고 종료는 제외합니다. 월요일 09:00~12:00과 12:00~14:00은 허용합니다.
        - 같은 구간을 중복 제출하거나 서로 다른 요일 묶음에서 같은 요일 구간이 겹쳐도 **422**입니다.
        - `fieldErrors`로 문제 항목을 안내하며 검증 실패 시 전체 목록을 유지합니다.

        **저장 조건**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`이 함께 필요합니다.
        - Origin은 허용 목록의 정확한 scheme/host/port로 검증합니다. 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 관리자 `password` 및 가입 세션은 이 수정 API의 인증 수단이 아닙니다.
        - 유효성 검사에 실패하면 **422 VALIDATION_ERROR**와 `fieldErrors`를 반환하며 변경을 저장하지 않습니다.
        - 해당 영역만 원자적으로 저장하고 다른 영역은 유지합니다. 성공 시 현재 전체 프로필을 반환합니다.
        - 같은 값을 다시 저장해도 중복 항목을 만들지 않습니다. 실질 변경이 없으면 `updatedAt`을 유지합니다.
        - 동시 요청은 서버에 저장된 순서대로 해당 영역의 마지막 요청이 반영됩니다. 다른 영역의 값을 덮어쓰지 않습니다.
