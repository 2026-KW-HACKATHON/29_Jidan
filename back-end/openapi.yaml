  /api/stores/{storeId}/manual/qa/conversations/{conversationId}/questions:
    post:
      tags:
      - 근무자 AI 업무 질문
      operationId: askManualQuestion
      summary: 게시 매뉴얼에 근거한 AI 업무 질문
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다. 선택 매장의 현재 유효 USE_AI_QA 자료 접근과 APPROVED를 매 요청 검증합니다. 소유 대화·업로드 파일은 본인+매장에 귀속되며 접근 종료/수동 종료/다른 매장은 동일 404입니다. 초안·인터뷰 대화·점주 음성에는 접근할 수 없습니다.

        질문은 text(1~2000자) 또는 본인 READY 음성 transcriptionId 중 하나이며 사진은 동일 매장·본인의 유효 QUESTION_IMAGE 최대 3개입니다. 사진만 보내는 질문은 거절합니다. 텍스트 수정 후 전송은 TEXT를 사용합니다. 질문에서 현재 게시 versionId를 원자적으로 캡처하고 그 불변 본문만 검색합니다. 공개 missingInformation에 해당하는 미확정 사실·사진 추론·게시본 밖 일반 지식을 근무 지시로 생성하지 않습니다.

        ANSWERED에는 해당 versionId와 게시 섹션 ID·제목·근거 인용을 1개 이상 포함하고 서버가 인용/참조를 검증합니다. 근거 없음·모순·미확정이면 NEEDS_OWNER(점주님께 확인), citations=[]입니다. worker 질문/이미지는 참고 입력이고 시스템 지시나 점주 확인 내용으로 간주하지 않습니다. 모델/provider/prompt/점주 비공개 답변·평가 로그는 공개하지 않습니다.

        RUNNING으로 비동기 접수하며 같은 대화에 진행 작업은 1개만 허용합니다. 동일 key 재시도는 같은 질문, 새 key로 진행 중 제출은 409 QA_BUSY입니다. 처리 완료 직전 주체·매장·현재 접근을 다시 확인합니다. 접근 종료면 결과를 공개하지 않습니다. 게시가 처리 중 바뀌어도 원래 snapshot으로 결과를 저장하고 근거 이동은 expectedVersionId로 보호합니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
