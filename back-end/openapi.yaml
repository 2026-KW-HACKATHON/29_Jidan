  /api/stores/{storeId}/manual/interviews/{sessionId}:
    get:
      tags:
      - 점주 AI 인터뷰
      operationId: getManualInterview
      summary: 인터뷰 진행·질문·이해 확인 상태 조회
      description: |-
        현재 미답변 질문 한 개와 인텐트별 진행 상태, 비동기 평가/생성·오류를 반환합니다. 2초 간격 polling과 429 Retry-After를 따릅니다.

        **질문 하나 → 답변 하나 → Jev 판단**

        - COLLECTING은 현재 질문 한 개만 제시합니다. 답변 하나를 저장할 때마다 즉시 Jev 평가를 예약하고 PROCESSING으로 이동합니다. 다른 질문의 답변을 모아 기다리지 않습니다.
        - 충분하면 현재 인텐트를 COVERED로 완료하고 finishedAt을 기록한 뒤 바로 다음 필수 질문을 생성합니다. 중간 점주 확인은 다음 질문의 선행 조건이 아닙니다.
        - 부족하면 같은 인텐트의 추가 질문 한 개를 생성합니다. 그 답변도 즉시 Jev가 판단합니다. 평가 입력은 현재 인텐트의 기본 질문부터 누적된 질문·답변입니다.
        - 기본 depth=0, 새 추가 질문 한 개마다 depth+1, 최대 5입니다. 같은 질문/평가의 재시도와 fallback은 depth를 증가시키지 않습니다.
        - depth 5에서도 부족하면 NEEDS_DETAIL(검수중)과 finishedAt을 기록하고 다음 인텐트로 진행합니다. 마지막 인텐트면 READY_TO_GENERATE입니다.
        - 검수중 항목은 최종 초안 issues에 남기며 최종 검토에서 점주 확인만으로 발행할 수 있습니다. 인터뷰에서는 충분/상한 부족 모두 확인 대기 없이 다음 질문으로 진행합니다.
        - 각 인텐트 완료 시 독립 검토 리소스를 생성합니다. GET reviews 또는 intents/{intentId}/review로 요약을 조회·정정·확인하고 사진을 관리합니다. 검토 확인은 진행 조건이 아니며 세션에 단일 review 또는 REVIEWING 대기 상태를 두지 않습니다.
        - Jev 판단과 추가 질문 문구 생성은 별도 작업입니다. 실패를 정보 충분/부족으로 간주하지 않으며 자동 재시도 → fallback까지 실패하면 ERROR로 정지합니다. 질문·답변·인텐트·depth를 보존해 실패 작업부터 재개합니다.
        - 질문 셋·평가 입력·실제 설정/시도 이력은 불변 보관합니다. 동일 질문 답변의 성공 판단과 다음 진행은 한 번만 적용하며 provider 원문 오류/내부 prompt는 공개하지 않습니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.
