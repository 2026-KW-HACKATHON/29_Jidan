                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '다른 역할: FORBIDDEN. 정지 계정: ACCOUNT_SUSPENDED. 승인 대기: STORE_APPROVAL_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 이 기능을 사용할 권한이 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: '다른 점주/없는 매장: STORE_NOT_FOUND. 매장에 속하지 않는 초안/세션/파일: MANUAL_RESOURCE_NOT_FOUND.'
          content:
