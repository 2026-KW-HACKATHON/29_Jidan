  /api/auth/session:
    get:
      tags:
      - 세션
      operationId: getCurrentSession
      summary: 현재 회원·가입 완료 상태·역할·매장 권한 조회
      description: |-
        새로고침·로그인 완료 후 화면 이동을 결정할 때 사용합니다. 매장 승인 변경은 현재 DB 상태를 반영합니다.

        **세션 오류**

        - 가입 전 세션: **401 · `REGISTRATION_REQUIRED`**
        - 정지 계정: **403 · `ACCOUNT_SUSPENDED`**, 세션 폐기

        **점주 화면 이동**

        - `PENDING` 매장만 있는 경우: `nextAction=OWNER_APPROVAL_PENDING`
        - 승인된 매장이 하나라도 있는 경우: `nextAction=OWNER_HOME`
      responses:
        '200':
          description: 로그인한 회원과 현재 권한
          content:
