  /api/stores/{storeId}/job-postings/{jobId}/applications/{applicationId}/work-requests:
    post:
      tags:
      - 대타 근무 요청
      operationId: requestApplicantWork
      summary: 선택 지원자에게 근무 요청
      description: |-
        ACTIVE OWNER 세션, 해당 매장의 소유권과 APPROVED를 매 요청 확인합니다. 소유권 없는/없는 매장은 동일 404 RESOURCE_NOT_FOUND입니다.

        미래 시작·RECRUITING·미확정 공고의 APPLIED 지원자에게 요청합니다. 단일 공고에 유효 PENDING 요청은 최대 1개입니다. pending 중 다른 요청은 409 WORK_REQUEST_PENDING입니다. 요청 기한은 min(요청+1시간, 근무 시작)이며 expiresAt과 같은 시각부터 수락 불가입니다. 1시간 미응답은 EXPIRED로 처리하고 지원을 APPLIED로 되돌려 다른 지원자를 요청할 수 있습니다.

        요청 후 1시간 또는 근무 시작 중 먼저 오는 시각의 만료는 사용자 확정 정책입니다. 만료 작업과 조회/응답 시각 검증을 병행하며 배치 실행 지연으로 기한이 늘어나지 않습니다. 요청을 같은 지원자에게 다시 보낼 수 있으나 이전 요청 ID는 계속 만료 상태입니다. 공고/지원/요청 상태·revision·알림 outbox를 같은 트랜잭션으로 저장합니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.

        사용자 확정 기한: expiresAt=min(requestedAt+1시간, job.startAt). 예: 서울 08:30 요청/09:00 근무이면 09:00 만료입니다. 정확히 expiresAt부터 수락·거절·요청 철회 불가이며 요청 조회는 EXPIRED로 투영합니다. 배치 지연이 기한을 연장하지 않습니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: storeId
        in: path
        required: true
        description: 'storeId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: jobId
        in: path
        required: true
        description: 'jobId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: applicationId
        in: path
        required: true
        description: 'applicationId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 같은 논리 요청의 재시도에는 동일 UUID를 사용합니다.
        schema:
          type: string
          format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
                requestId: req_chapter_100
                fieldErrors: []
        '404':
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESOURCE_NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                requestId: req_chapter_100
                fieldErrors: []
        '422':
          description: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
          content:
            application/json:
              schema:
