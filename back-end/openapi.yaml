              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: 없는 매장 또는 다른 점주의 매장. 하위 리소스도 해당 매장에 속하는지 함께 확인합니다.
          content:
