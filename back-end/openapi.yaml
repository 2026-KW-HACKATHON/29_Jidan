    post:
      tags:
      - 대타 근무 요청
      operationId: withdrawWorkConfirmation
      summary: 점주 근무 확정 철회 (근무 시작 전)
      description: |-
        ACTIVE OWNER 세션, 해당 매장의 소유권과 APPROVED를 매 요청 확인합니다. 소유권 없는/없는 매장은 동일 404 RESOURCE_NOT_FOUND입니다.

        첨부 수정 디자인의 확정 철회하기입니다. 사용자 확정 정책: 근무 시작 전까지만 허용하며 now < job.startAt을 공고 잠금 안에서 검증합니다. startAt과 같은 시각부터는 409 JOB_ALREADY_STARTED입니다. 해당 공고의 현재 ACCEPTED 확정 요청과 expectedRevision 일치가 필요하며 다른 매장·공고 귀속/타인 요청은 404입니다.

        ACCEPTED→CONFIRMATION_WITHDRAWN으로 변경하고 수락 시각 respondedAt은 보존, endedAt은 철회 시각으로 갱신합니다. 이 요청이 생성한 TEMPORARY 접근만 REVOKED/permissions=[]로 종료합니다. 신규 종료이면 revokedAt=철회 시각이고, 이미 REVOKED이면 최초 revokedAt을 유지하여 기존 수동 종료 이력을 덮어쓰지 않습니다. 캘린더 연결을 해제하여 활성 캘린더 응답에서 제외하되 확정·접근·일정 감사 이력은 삭제하지 않습니다. 다른 REGULAR 접근이나 다른 공고의 TEMPORARY 접근은 변경하지 않습니다.

        해당 공고의 확정 슬롯을 해제하고 지원 CONFIRMED→APPLIED로 복구합니다. 수락 시 그 확정 requestId 때문에 NOT_SELECTED가 된 지원만 원인 이력으로 식별해 APPLIED로 복구합니다. WITHDRAWN/개별 종료/다른 확정에 따른 이력은 되살리지 않습니다. 수락 당시의 변경 원인·이전 상태·대상 지원 ID를 저장하여 정확히 복구해야 합니다. 같은 트랜잭션에서 공고를 CLOSED→RECRUITING으로 다시 열고 closedAt=null로 초기화합니다. 이전 수락·마감·철회 시각은 확정/상태 전이 이력에 보존합니다. 이후 신규 지원과 다른 지원자 요청을 허용하며, 점주가 모집을 끝내려면 별도 모집 마감 API를 호출합니다.

        공고→요청→지원→접근·캘린더 잠금으로 수락·확정 철회·마감을 직렬화하고 모든 변경과 근무자 알림 outbox를 원자 처리합니다. 요청/지원/공고 revision을 증가시킵니다. 새로운 근무 요청은 새 requestId와 key가 필요하며 철회된 기존 요청은 재수락 불가입니다. 같은 key 재시도는 최초 200 결과, 다른 key 재철회는 409 WORK_CONFIRMATION_NOT_ACTIVE입니다. 완료된 근무 이력은 이 API로 변경할 수 없습니다.

