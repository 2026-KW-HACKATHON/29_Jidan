  /api/stores/{storeId}/manual/interviews/{sessionId}/answers:
    post:
      tags:
      - 점주 AI 인터뷰
      operationId: answerManualInterviewQuestion
      summary: 인터뷰 질문에 텍스트·음성 답변 제출
      description: |-
        COLLECTING의 현재 인텐트·공개 질문 묶음에 있는 미답변 questionId에만 제출합니다. 질문당 최초 답변은 한 번이며 다른 key의 중복 답변은 409 QUESTION_ALREADY_ANSWERED입니다. 이전/다음 인텐트나 다른 세션 질문은 409 INTERVIEW_STATE_CONFLICT입니다.

        - TEXT는 비어있지 않은 text를 저장합니다. VOICE는 같은 매장의 READY transcriptionId만 받으며 저장된 전사 텍스트를 답변으로 기록합니다. 전사 진행/실패는 409 TRANSCRIPTION_NOT_READY, 다른 매장 전사는 404입니다.
        - photoIds는 선택 사항입니다. 같은 매장의 미삭제 MANUAL_PHOTO만 질문 문맥에 연결합니다. 생략은 빈 목록입니다. 사진 없이도 답변할 수 있습니다.
        - 답변과 revision 증가를 먼저 원자적으로 저장합니다. 묶음에 미답변 질문이 있으면 202 COLLECTING, 전부 답변했으면 202 PROCESSING으로 평가를 예약합니다. 답변 순서는 묶음 내에서 자유롭습니다.
        - 평가 입력에는 현재 인텐트의 기본 질문부터 누적 질문·답변과 사용한 다른 문맥을 불변 snapshot으로 보존합니다. 성공 평가 적용 및 다음 작업 예약은 한 번만 반영합니다.
        - 충분성 평가 이후 필요한 질문을 가변 묶음으로 생성합니다. 동일 묶음의 모든 질문을 준비한 뒤 공개하며 자동 재시도/fallback은 현재 depth를 유지합니다.
        - 처리 중 추가 답변 제출은 409입니다. 입력 텍스트/사진은 수집 자료이며 시스템 지시로 실행하지 않습니다. 원문 답변과 비공개 평가를 로그/분석에 기록하지 않습니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 해당 세션 또는 초안의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 상태 갱신·작업 예약·outbox 저장은 원자적입니다. 예약 실패는 **503 JOB_QUEUE_UNAVAILABLE**이며 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
