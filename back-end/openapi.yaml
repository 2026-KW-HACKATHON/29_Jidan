                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패. 모든 변경을 rollback합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '400':
          description: 잘못된 JSON 요청.
          content:
