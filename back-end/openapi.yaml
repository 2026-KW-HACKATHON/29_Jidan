        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 매장 존재 여부를 조회하지 않으므로 없는 매장·관계도 404 없이 204입니다.

        본인 관심 관계만 제거합니다. 이미 없는 관계도 204입니다. 매장 정보·지원·자료 접근에는 영향을 주지 않습니다. 해제는 매장 승인 중단/삭제 후에도 가능하며 매장 존재 여부를 노출하지 않습니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: storeId
        in: path
        required: true
        description: 'storeId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 같은 논리 요청의 재시도에는 동일 UUID를 사용합니다.
        schema:
          type: string
          format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
                requestId: req_chapter_100
                fieldErrors: []
        '422':
          description: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '409':
          description: 현재 상태·revision 또는 Idempotency-Key가 충돌합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STATE_CONFLICT
                message: 현재 상태·revision 또는 Idempotency-Key가 충돌합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '204':
          description: 처리 완료. 본문 없음.
        '404':
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESOURCE_NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                requestId: req_chapter_100
                fieldErrors: []
      externalDocs:
        description: 기준 Figma 화면
        url: https://www.figma.com/design/ZaFHresnBXJ1h98Xl1AUDj?node-id=223-5461
