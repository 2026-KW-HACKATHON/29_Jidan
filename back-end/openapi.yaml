  /api/stores/{storeId}/manual/interviews/{sessionId}/intents/{intentId}/review/photos:
    put:
      tags:
      - 점주 AI 인터뷰
      operationId: replaceManualInterviewReviewPhotos
      summary: 인텐트 사진 연결·이름·설명·순서 수정
      description: |-
        선택한 READY 요약의 사진 배열을 전체 교체합니다. 0.12.0부터 SECTION 대상에는 같은 매장의 MANUAL_VIDEO도 mediaId로 연결할 수 있으며 응답 항목은 kind=VIDEO와 posterMediaId를 함께 보여 줍니다(대표 프레임은 근무자 표시용). 사진·영상은 연결된 업무 내용과 함께 표시되고, 목록에서 빼도 작성한 업무 단계는 그대로 남습니다(Figma 777-3464). 영상은 근무 구조 사진(WORK_STRUCTURE)에는 연결할 수 없습니다(422). target=WORK_STRUCTURE는 WORK_STRUCTURE 단계의 인텐트만 허용하고 sectionId=null입니다. SECTION은 선택한 review.content.sections에 속한 sectionId가 필요합니다. 같은 세션의 이전 인텐트도 path로 선택할 수 있습니다. 같은 매장의 미삭제 MANUAL_PHOTO만 허용하며 다른 매장/없는 파일은 404, 음성·중복 mediaId·대상 불일치는 422입니다. 빈 배열은 연결 해제입니다. title과 선택 caption 및 배열 순서를 저장하고 초안 생성 때 같은 근무조·섹션 UUID에 그대로 연결합니다. 게시본 사진은 삭제하지 않습니다.

        **항목별 검토·동시성**

        - path의 intentId로 완료된 COVERED 또는 NEEDS_DETAIL 항목을 지정합니다. 다른 매장/세션의 인텐트는 404 MANUAL_RESOURCE_NOT_FOUND, 아직 PENDING이면 409 REVIEW_NOT_READY입니다. content.intentId는 반드시 path와 일치합니다.
        - 검토는 세션의 질문 진행과 독립적입니다. COLLECTING, PROCESSING, READY_TO_GENERATE에서 완료된 이전 항목을 검토할 수 있으며 현재 질문·인텐트·depth를 바꾸지 않습니다. 확인은 다음 질문과 초안 생성의 선행 조건이 아닙니다.
        - 변경의 expectedRevision은 해당 검토 리소스 revision입니다. 질문 진행의 session revision과 별개이며 불일치는 409 REVISION_CONFLICT입니다. 변경 시 검토 revision만 증가합니다. GET 목록은 sessionRevision과 전체 검토를 같은 읽기 스냅샷으로 반환합니다.
        - 같은 검토가 PROCESSING이면 추가 정정·확인·사진 변경은 409 REVIEW_PROCESSING입니다. ERROR에서는 retries만 허용합니다. 세션 GENERATING/COMPLETED에서는 모든 검토 변경·재시도가 409 INTERVIEW_STATE_CONFLICT입니다. 조회는 허용합니다.
        - 정정과 사진의 실질 변경은 confirmedAt을 null로 초기화합니다. 확인 이력은 검토 revision과 함께 보존합니다. 동일 사진 내용 또는 동일 revision의 중복 확인은 revision과 최초 확인 시각을 유지합니다.
        - 각 답변 평가와 질문 생성은 시작 시 사용한 검토 revision을 입력 snapshot에 고정합니다. 이전 항목을 정정해도 이미 진행한 Jev 결과를 재적용하거나 현재 질문을 교체하지 않습니다. 이후 예약되는 작업부터 최신 READY 검토를 사용합니다. 정정 처리 중에는 이전 READY 내용을 사용할 수 있으며 사용 버전을 이력에 남깁니다.
        - 검토는 이 요청이 아니라 답변 평가 작업이 인텐트를 끝낼 때 만들어집니다. 그때 인텐트 종료·검토 요약 작업과 (다음 인텐트가 있으면) 다음 질문 작업을 한 트랜잭션으로 예약합니다. 요약 생성 실패는 해당 검토만 ERROR로 표시하고 질문 진행을 멈추지 않습니다. 정정도 검토별로 실행하며 task ID·검토 입력 revision으로 중복/오래된 결과의 덮어쓰기를 막습니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 대상 검토 리소스의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 이 요청은 작업을 예약하거나 파일을 저장하지 않고 DB 상태만 원자적으로 바꿉니다. 실패하면 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
        - 워커 작업은 입력 revision과 작업 ID를 확인해 성공 결과를 한 번만 적용합니다. 오래된 작업 결과는 현재 상태를 덮어쓰지 않습니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '401':
          description: '세션 없음·만료·폐기: SESSION_EXPIRED. 가입 세션만 존재: REGISTRATION_REQUIRED.'
