        - acceptedAt
        - acceptedBy
        - declinedAt
        - canceledAt
      description: 메일 주소에 바인딩한 초대. PENDING은 수락 가능한 초대이며 두 종료 시각 중 먼저 도달하면 EXPIRED로 조회합니다. 수락/거절/취소가 완료된 상태는 링크 기간이 지나도
        유지합니다. 원문 토큰/링크는 응답에 포함하지 않습니다.
    StoreInvitationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          pattern: ^\S+$
          description: 검증된 Google 이메일과 비교할 초대 대상. 앞뒤 공백 제거 후 전체 소문자로 비교·저장합니다. Gmail 점/plus/다른 별칭은 통합하지 않습니다.
        accessExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          default: null
          description: 선택한 접근 종료 시각. 생략/null은 별도 종료 전까지. 생성 시각보다 미래여야 하며 Asia/Seoul 화면 날짜는 종료 다음 날 00:00을 ISO 시각으로 변환합니다.
