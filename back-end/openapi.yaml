  /api/users/me/work-requests/{requestId}/response:
    post:
      tags:
      - 대타 근무 요청
      operationId: respondToWorkRequest
      summary: 근무 요청 수락·거절과 근무 확정
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다.

        본인 PENDING 요청에 ACCEPT 또는 DECLINE합니다. now < expiresAt, 근무 시작 전, RECRUITING·미확정, 지원 미철회 상태를 공고 잠금 안에서 재검증합니다. 수락 시 요청 ACCEPTED, 지원 CONFIRMED, 선택 지원을 제외한 현재 APPLIED/REQUESTED 지원만 NOT_SELECTED, 미결 요청 CANCELLED, 근무 캘린더·TEMPORARY 자료 접근·알림 outbox를 원자적으로 생성합니다. 같은 트랜잭션에서 공고를 RECRUITING→CLOSED로 전환하고 closedAt=respondedAt을 기록하며 공고 revision을 증가시킵니다. 확정 후 신규 지원/요청은 JOB_FILLED로 막으며, 현재 확정 여부를 일반 CLOSED 검사보다 먼저 판정합니다. DECLINE은 공고를 마감하지 않고 RECRUITING/closedAt=null을 유지합니다.

        TEMPORARY 접근은 수락 시각부터 근무 종료 시각까지 [startedAt, validUntil)로 부여하여 출근 전 온보딩을 허용합니다. 현재 게시본이 없어도 확정은 성공하고 온보딩은 MANUAL_NOT_PUBLISHED 상태입니다. 정기 접근과 독립적으로 공존하며 기존 수동 종료 이력은 되살리지 않습니다. 거절은 지원을 APPLIED로 돌리고 점주가 다른 지원자를 선택할 수 있습니다. 본인의 이미 확정된 대타와 근무 시간이 겹치면 409 WORK_INTERVAL_CONFLICT(제안 정책); 인접 구간은 허용합니다. 새 key로 같은 응답은 409, 동일 key 재시도는 최초 결과입니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.

        만료된 요청과 연결 지원을 먼저 정리한 뒤 수락을 적용합니다. 과거 WITHDRAWN/NOT_SELECTED/COMPLETED 지원은 변경 대상에서 제외하고 상태·revision·철회 시각·요청 이력을 보존합니다. 확정 철회 복구를 위해 이번 수락으로 실제 NOT_SELECTED로 변경한 지원만 원인 requestId와 직전 상태/ID·적용 후 revision을 저장합니다. 복구는 현재 NOT_SELECTED 및 적용 revision이 일치하는 지원만 APPLIED로 전환하며 REQUESTED나 취소된 요청은 복원하지 않습니다. 취소된 과거 요청(CANCELLED/CONFIRMATION_WITHDRAWN)은 재수락할 수 없습니다. 점주 확정 철회는 근무 시작 전 별도 API입니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: 'requestId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
