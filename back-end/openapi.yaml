              $ref: '#/components/schemas/ManualDraftCorrectionRetry'
            example:
              expectedVersionId: a0912ce8-1103-428d-aed0-57a5d78c7f0d
              expectedRevision: 1
      responses:
        '202':
          description: 같은 정정 작업의 다음 시도 예약.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              description: RUNNING일 때 다음 조회까지 대기할 초. 기본 2초.
              schema:
                type: integer
                minimum: 1
              example: 2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualDraftCorrection'
              examples:
                running:
                  value:
                    id: 58d477da-8a0f-4b60-a5b5-497c5d5ec114
                    versionId: a0912ce8-1103-428d-aed0-57a5d78c7f0d
                    baseRevision: 1
                    target:
                      kind: SHIFT
                      targetId: 44b35781-3e98-4f28-9505-2178b2863c5e
                    status: RUNNING
                    attempt: 2
                    resultRevision: null
                    error: null
                    createdAt: 2026-10-05T02:00:00Z
                    completedAt: null
        '400':
          description: 잘못된 JSON 요청.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: JSON 요청 형식을 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '401':
          description: '세션 없음·만료·폐기: SESSION_EXPIRED. 가입 세션만 존재: REGISTRATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SESSION_EXPIRED
                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '다른 역할: FORBIDDEN. 정지 계정: ACCOUNT_SUSPENDED. 승인 대기: STORE_APPROVAL_REQUIRED. CSRF/Origin 오류: CSRF_INVALID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 이 기능을 사용할 권한이 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: '다른 점주/없는 매장: STORE_NOT_FOUND. 매장에 속하지 않는 초안/세션/파일: MANUAL_RESOURCE_NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MANUAL_RESOURCE_NOT_FOUND
                message: 매뉴얼 리소스를 찾을 수 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '409':
          description: 초안 없음/교체 MANUAL_VERSION_CONFLICT, revision 불일치 REVISION_CONFLICT, 생성 미완료/게시본 MANUAL_STATE_CONFLICT, 정정 중 MANUAL_CORRECTION_IN_PROGRESS, 전사 미완료 TRANSCRIPTION_NOT_READY, 동일 키의 다른 본문 IDEMPOTENCY_KEY_REUSED, 재시도 불가 MANUAL_CORRECTION_NOT_RETRYABLE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MANUAL_CORRECTION_IN_PROGRESS
                message: 현재 상태를 확인한 뒤 다시 요청해 주세요.
                requestId: req_manual_correction_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패. 모든 변경을 rollback합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '503':
          description: 작업 예약 일시 장애. 변경 전체 rollback, 같은 Idempotency-Key로 재시도 가능.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: JOB_QUEUE_UNAVAILABLE
                message: 잠시 후 다시 시도해 주세요.
                requestId: req_profile_001
                fieldErrors: []
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: jidan_session
      description: |-
        서버에 저장한 opaque 회원 세션.

        운영에서는 HttpOnly; Secure; SameSite=Lax; Path=/; Domain 생략.

        유휴 24시간/절대 7일 만료 중 먼저 도래하는 시점에 재로그인.

        권한은 매 요청 DB 기준으로 재검증.
    RegistrationCookie:
      type: apiKey
      in: cookie
      name: jidan_registration
      description: |-
        Google 인증 후 아직 가입하지 않은 주체 전용 opaque 세션.

        HttpOnly; Secure; SameSite=Lax; Path=/api/auth; Domain 생략.

        600초 고정 만료, 일반 API 접근 불가.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: GET /api/auth/csrf로 받은 현재 회원/가입 세션에 바인딩된 synchronizer token. 쿠키만으로 변경 요청을 허용하지 않는다.
        가입 완료 시 세션과 함께 회전.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        최종 가입 제출마다 만든 UUID.

        같은 Google 주체·endpoint·정규화 본문으로 24시간 재시도하면 최초 201 결과를 재현.

        다른 본문/역할에 같은 key는 409 IDEMPOTENCY_KEY_REUSED.

        성공 후 가입 쿠키가 소비된 경우 회원 세션으로 동일 주체를 확인해야 재현 가능.

        어느 세션도 없으면 401 후 재로그인.

        동시 제출은 중복 저장되지 않으며 Google sub·사업자 번호 DB unique 제약을 함께 적용.
      schema:
        type: string
        format: uuid
      example: a1c2de34-56f7-4890-9abc-def012345678
    StoreId:
      name: storeId
      in: path
      required: true
      description: 세션 점주가 관리하는 매장의 UUID
      schema:
        type: string
        format: uuid
      example: 51c1c743-d377-4e7a-8449-94377eecfce0
    OwnerStoreCreationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 매장 추가 요청마다 생성한 UUID. 세션 점주·endpoint·정규화 body로 24시간 보관. 같은 key/body는 최초 201 재현, 다른 body는 409 IDEMPOTENCY_KEY_REUSED.
        재시도에도 현재 회원 인증을 검증합니다.
      schema:
        type: string
        format: uuid
      example: 8215b01a-ed7b-4c4a-950f-c6e1480bd563
    InvitationCreationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 초대 생성마다 만든 UUID. 회원 주체·endpoint·정규화 body로 24시간 기록. 같은 key는 최초 결과 재현, 다른 body는 409 IDEMPOTENCY_KEY_REUSED.
        인증·현재 매장 소유/승인 상태는 재검증합니다.
      schema:
        type: string
        format: uuid
      example: 8215b01a-ed7b-4c4a-950f-c6e1480bd563
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: URL 매장에 속하는 초대 UUID
      schema:
        type: string
        format: uuid
      example: fc95196b-5eb0-4a9a-a24b-1a5468c19563
    InvitationResendKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 재전송 클릭마다 만든 UUID. 재시도 시 같은 key를 유지합니다. 회원 주체·endpoint·정규화 body로 24시간 기록. 같은 key는 최초 결과 재현, 다른 body는
        409 IDEMPOTENCY_KEY_REUSED. 인증·현재 매장 소유/승인 상태는 재검증합니다.
      schema:
        type: string
        format: uuid
      example: 8215b01a-ed7b-4c4a-950f-c6e1480bd563
    StoreWorkerId:
      name: workerId
      in: path
      required: true
      description: 해당 매장에 접근 이력이 있는 WORKER의 회원 UUID
      schema:
        type: string
        format: uuid
      example: 7390d3c1-dc0d-4b1c-814d-b68a1df5c1b6
    ManualCommandKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 매뉴얼/인터뷰/미디어 변경 요청의 중복 방지. 회원 주체·endpoint·정규화 body로 24시간 기록. 같은 key는 최초 결과 재현, 다른 body는 409 IDEMPOTENCY_KEY_REUSED.
        인증·현재 매장 소유/승인 상태는 재검증합니다.
      schema:
        type: string
        format: uuid
      example: 8215b01a-ed7b-4c4a-950f-c6e1480bd563
  headers: {}
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: 클라이언트 분기용 오류 코드
          example: VALIDATION_ERROR
        message:
          type: string
          description: 사용자에게 표시할 안전한 안내
          example: 입력한 정보를 확인해 주세요.
        requestId:
          type: string
          description: 비밀값이 포함되지 않은 추적 ID. 같은 응답의 `X-Request-ID` 헤더와 같은 값입니다.
          example: req_example_001
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                example: phoneNumber
              code:
                type: string
                example: INVALID_FORMAT
              message:
                type: string
                example: 전화번호 형식을 확인해 주세요.
            required:
            - field
            - code
            - message
          description: 422의 필드별 오류. 그 외에는 빈 배열.
          maxItems: 100
      required:
      - code
      - message
      - requestId
      - fieldErrors
    Name:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^\S(?:.*\S)?$
      description: 앞뒤 공백 제거 후 1–50자. 공백만인 이름은 거절.
      example: 김지수
    PhoneNumber:
      type: string
      pattern: ^010[0-9]{8}$
      description: 화면의 하이픈을 제거한 한국 휴대전화 번호
      example: '01012345678'
    Industry:
      type: string
      enum:
      - RESTAURANT
      - CAFE
      - CONVENIENCE_STORE
      - OTHER
      description: 업종 코드 제안. 음식점/카페/편의점/기타. UI 선택지 확정 시 공동 조정.
      example: CAFE
    Career:
      type: object
      properties:
        industry:
          $ref: '#/components/schemas/Industry'
        duties:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
          example: 음료 제조, 고객 응대
        storeName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: 월계 카페
        startMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2024-03
        endMonth:
          type:
          - string
          - 'null'
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2025-02
        isCurrent:
          type: boolean
          example: false
      required:
      - industry
      - duties
      - startMonth
      - endMonth
      - isCurrent
      description: 현재 근무 중이면 endMonth=null. 종료 경력은 종료>=시작. 시작/종료는 현재 연월 이하. 서버에서 연월 순서와 공백을 검증.
      additionalProperties: false
      oneOf:
      - properties:
          isCurrent:
            const: true
          endMonth:
            type: 'null'
        required:
        - isCurrent
        - endMonth
        type: object
      - properties:
          isCurrent:
            const: false
          endMonth:
            type: string
        required:
        - isCurrent
        - endMonth
        type: object
    Availability:
      type: object
      additionalProperties: false
      properties:
        days:
          type: array
          items:
            type: string
            enum:
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
            - SUN
          minItems: 1
          maxItems: 7
          uniqueItems: true
          example:
          - MON
          - WED
          - FRI
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):(00|30)$
          example: 09:00
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):(00|30)$
          example: '14:00'
        endsNextDay:
          type: boolean
          description: 종료일이 시작 요일의 다음 날이면 true. SUN 다음 날은 MON.
          example: false
      required:
      - days
      - startTime
      - endTime
      - endsNextDay
      description: |-
        Asia/Seoul 기준 매주 반복, 30분 단위.

        서버에서 0<기간<=24시간을 검증.

        같은 요일 및 심야 구간의 다음 요일 중첩은 422.

        24:00 대신 00:00/endsNextDay 사용.

        endsNextDay=false이면 종료>시작, true이면 종료<=시작.
    WorkerRegistrationRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        birthDate:
          type: string
          format: date
          description: 실제 달력 날짜. 미래 생일은 422. 연령 제한은 별도 제품 정책 확정 필요.
          example: '2001-03-14'
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          description: Figma의 남성/여성 선택지
          example: FEMALE
        experienceLevel:
          type: string
          enum:
          - NEW
          - EXPERIENCED
          example: NEW
        careers:
          type: array
          items:
            $ref: '#/components/schemas/Career'
          maxItems: 20
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/Availability'
          minItems: 1
          maxItems: 100
      required:
      - name
      - phoneNumber
      - birthDate
      - gender
      - experienceLevel
      - careers
      - availabilities
      description: 화면 각 단계는 프론트엔드 임시 입력으로 유지하며 최종 확인에서 한 번에 제출. Google 이메일/주체/role은 서버 결정.
      additionalProperties: false
      oneOf:
      - properties:
          experienceLevel:
            const: NEW
          careers:
            maxItems: 0
        required:
        - experienceLevel
        - careers
        type: object
      - properties:
          experienceLevel:
            const: EXPERIENCED
          careers:
            minItems: 1
        required:
        - experienceLevel
        - careers
        type: object
    StoreRegistrationInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: 명랑핫도그 광운대점
        industry:
          $ref: '#/components/schemas/Industry'
        postalCode:
          type: string
          pattern: ^\d{5}$
          example: '01897'
        address:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          example: 서울특별시 노원구 광운로 20
        detailAddress:
          type: string
          maxLength: 200
          example: 1층
        businessRegistrationNumber:
          type: string
          pattern: ^\d{10}$
          description: 화면 하이픈 제거. 서버에서 검증한 번호로 중복 확인.
          example: '1234567890'
        phoneNumber:
          type: string
          pattern: ^0[0-9]{8,10}$
          description: 하이픈 없는 매장 전화번호. 지역번호와 휴대전화 허용.
          example: '029123456'
      required:
      - name
      - industry
      - postalCode
      - address
      - businessRegistrationNumber
      - phoneNumber
      description: |-
        주소와 우편번호는 서버가 주소 데이터로 확인하고 행정동 월계1동인지 판단.

        사용자가 지정한 region/승인 상태는 받지 않음.

        소재지·관리 권한의 최종 승인은 운영자 담당.

        이미 등록된 사업자 번호는 409 STORE_ALREADY_REGISTERED; 자동 권한 부여 없음.
    OwnerRegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        store:
          $ref: '#/components/schemas/StoreRegistrationInput'
      required:
      - name
      - phoneNumber
      - store
      description: 점주 기본 정보와 최초 매장 신청을 같은 트랜잭션으로 저장. 저장 실패 시 회원/매장/권한 모두 rollback. 가입 성공은 운영 승인과 별개.
    GoogleIdentity:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          const: GOOGLE
        email:
          type: string
          format: email
          example: member@example.com
        emailVerified:
          type: boolean
          const: true
      required:
      - provider
      - email
      - emailVerified
      description: |-
        서버가 검증한 iss/aud/exp/nonce/email_verified 및 Google sub로 확인한 주체.

        이메일로 기존 계정을 자동 병합하지 않음.

        Google sub는 응답에 노출하지 않음.
    RegistrationContext:
      type: object
      additionalProperties: false
      properties:
        identity:
          $ref: '#/components/schemas/GoogleIdentity'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-02T10:10:00Z'
        allowedRoles:
          type: array
          items:
            type: string
            enum:
            - WORKER
            - OWNER
          minItems: 2
          maxItems: 2
          uniqueItems: true
          example:
          - WORKER
          - OWNER
      required:
      - identity
      - expiresAt
      - allowedRoles
      description: Google 로그인은 완료되었지만 회원 가입 전인 상태. Google 이메일을 읽기 전용으로 표시하고 가입 유형 선택 화면으로 이동.
    StoreAccess:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
          example: 51c1c743-d377-4e7a-8449-94377eecfce0
        storeName:
          type: string
          example: 명랑핫도그 광운대점
        approvalStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          description: 운영자 승인 대기 또는 승인 완료. 거절/재신청 정책은 후속 설계.
          example: PENDING
        permissions:
          type: array
          items:
            type: string
            enum:
            - READ_STORE_STATUS
            - MANAGE_STORE
            - INVITE_WORKERS
            - MANAGE_JOB_POSTINGS
            - MANAGE_MANUALS
          uniqueItems: true
          example:
          - READ_STORE_STATUS
      required:
      - storeId
      - storeName
      - approvalStatus
      - permissions
      description: |-
        본인 관리 매장만 반환.

        PENDING는 READ_STORE_STATUS만 허용.

        APPROVED만 운영 권한 허용.

        서버는 매 요청 매장 소유/승인 상태를 검증하며 이 응답을 인가 근거로 신뢰하지 않음.
      additionalProperties: false
      oneOf:
      - properties:
          approvalStatus:
            const: PENDING
          permissions:
            items:
              const: READ_STORE_STATUS
            minItems: 1
            maxItems: 1
        required:
        - approvalStatus
        - permissions
        type: object
      - properties:
          approvalStatus:
            const: APPROVED
          permissions:
            minItems: 5
            maxItems: 5
        required:
        - approvalStatus
        - permissions
        type: object
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a7be5b17-30d8-4b47-bd75-e866b4539dc9
        role:
          type: string
          enum:
          - WORKER
          - OWNER
          example: WORKER
        name:
          $ref: '#/components/schemas/Name'
        identity:
          $ref: '#/components/schemas/GoogleIdentity'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        profileCompleted:
          type: boolean
          const: true
        permissions:
          type: array
          items:
            type: string
            enum:
            - BROWSE_JOB_POSTINGS
            - APPLY_FOR_JOBS
            - READ_OWN_PROFILE
            - READ_OWN_STORE_STATUS
          uniqueItems: true
          example:
          - BROWSE_JOB_POSTINGS
          - APPLY_FOR_JOBS
          - READ_OWN_PROFILE
        stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreAccess'
      required:
      - id
      - role
      - name
      - identity
      - phoneNumber
      - profileCompleted
      - permissions
      - stores
      description: |-
        WORKER: 공고 탐색/지원/내 프로필, stores=[].

        OWNER: 내 매장 상태 조회 및 stores의 승인된 매장 권한.

        WORKER의 업무 자료 접근은 별도 재직/대타 기간 검증이 필요하며 본 명세에서 포괄 권한을 부여하지 않음.
      additionalProperties: false
      oneOf:
      - properties:
          role:
            const: WORKER
          stores:
            maxItems: 0
          permissions:
            items:
              type: string
              enum:
              - BROWSE_JOB_POSTINGS
              - APPLY_FOR_JOBS
              - READ_OWN_PROFILE
            minItems: 3
            maxItems: 3
        required:
        - role
        - stores
        - permissions
        type: object
      - properties:
          role:
            const: OWNER
          stores:
            minItems: 1
          permissions:
            items:
              const: READ_OWN_STORE_STATUS
            minItems: 1
            maxItems: 1
        required:
        - role
        - stores
        - permissions
        type: object
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time
          description: 현재 세션 만료 시각. 유휴/절대 만료 중 빠른 값. 서버가 요청 처리 시 유휴 만료를 갱신할 수 있음.
          example: '2026-10-03T10:00:00Z'
        nextAction:
          type: string
          enum:
          - WORKER_HOME
          - OWNER_HOME
          - OWNER_APPROVAL_PENDING
          description: 프론트엔드 이동 힌트. 권한 증명으로 사용하지 않음.
          example: WORKER_HOME
      required:
      - user
      - expiresAt
      - nextAction
      additionalProperties: false
      oneOf:
      - properties:
          user:
            properties:
              role:
                const: WORKER
          nextAction:
            const: WORKER_HOME
        required:
        - user
        - nextAction
        type: object
      - properties:
          user:
            properties:
              role:
                const: OWNER
              stores:
                contains:
                  properties:
                    approvalStatus:
                      const: APPROVED
                  required:
                  - approvalStatus
          nextAction:
            const: OWNER_HOME
        required:
        - user
        - nextAction
        type: object
      - properties:
          user:
            properties:
              role:
                const: OWNER
              stores:
                not:
                  contains:
                    properties:
                      approvalStatus:
                        const: APPROVED
                    required:
                    - approvalStatus
          nextAction:
            const: OWNER_APPROVAL_PENDING
        required:
        - user
        - nextAction
        type: object
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          minLength: 32
          maxLength: 256
          example: example_csrf_token_0123456789abcdef
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-02T10:10:00Z'
      required:
      - csrfToken
      - expiresAt
      description: 세션 수명 이내에 만료. 응답 토큰을 메모리에 보관하고 모든 가입/로그아웃 요청의 X-CSRF-Token 헤더에 전송.
    AdminPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 1024
      pattern: \S
      description: |-
        관리자 공용 비밀번호. 매 요청 JSON body의 password에 입력합니다.

        - 원문을 그대로 검증하며 trim·축약·잘라내기를 하지 않습니다.
        - 응답·URL·로그·추적·오류 메시지에 비밀번호를 포함하지 않습니다.
        - 예시는 실제 비밀번호가 아닌 자리 표시자입니다.
      example: <admin-password>
    StoreApprovalSearchRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/AdminPassword'
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          description: 생략하면 승인 대기·완료 신청 전체 조회
          example: PENDING
        page:
          type: integer
          minimum: 0
          default: 0
          description: 0부터 시작하는 페이지
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 페이지당 신청 개수
      required:
      - password
    StoreApprovalStore:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: 명랑핫도그 광운대점
        industry:
          $ref: '#/components/schemas/Industry'
        postalCode:
          type: string
          pattern: ^\d{5}$
          example: '01897'
        address:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          example: 서울특별시 노원구 광운로 20
        detailAddress:
          type: string
          maxLength: 200
          example: 1층
        businessRegistrationNumber:
          type: string
          pattern: ^\d{10}$
          description: 화면 하이픈 제거. 서버에서 검증한 번호로 중복 확인.
          example: '1234567890'
        phoneNumber:
          type: string
          pattern: ^0[0-9]{8,10}$
          description: 하이픈 없는 매장 전화번호. 지역번호와 휴대전화 허용.
          example: '029123456'
      required:
      - id
      - name
      - industry
      - postalCode
      - address
      - businessRegistrationNumber
      - phoneNumber
      description: 승인 신청에 연결된 매장 정보. 신청 시 저장된 값이며 비밀번호는 포함하지 않습니다.
    StoreApprovalApplicant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/Name'
        email:
          type: string
          format: email
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
      required:
      - id
      - name
      - email
      - phoneNumber
      description: 승인 신청자 OWNER의 식별·연락 정보. email은 검증된 Google 이메일.
    StoreApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 매장 승인 신청 ID
        applicant:
          $ref: '#/components/schemas/StoreApprovalApplicant'
        store:
          $ref: '#/components/schemas/StoreApprovalStore'
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
        submittedAt:
          type: string
          format: date-time
          description: 최초 신청 시각. UTC/RFC 3339.
        approvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: PENDING은 null, APPROVED는 최초 승인 시각.
      required:
      - id
      - applicant
      - store
      - status
      - submittedAt
      - approvedAt
      description: |-
        점주 최초 매장 등록과 같은 트랜잭션에서 생성되는 승인 신청입니다.

        - 최초 상태는 PENDING이며 approvedAt은 null입니다.
        - 승인 완료 상태는 APPROVED이며 approvedAt은 최초 승인 시각입니다.
        - 요청에는 사용자 지정 status나 approvedAt을 받지 않습니다.
      oneOf:
      - type: object
        properties:
          status:
            const: PENDING
          approvedAt:
            type: 'null'
        required:
        - status
        - approvedAt
      - type: object
        properties:
          status:
            const: APPROVED
          approvedAt:
            type: string
        required:
        - status
        - approvedAt
    StoreApprovalPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreApprovalRequest'
          maxItems: 100
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
          description: 필터에 맞는 전체 신청 개수
        totalPages:
          type: integer
          minimum: 0
          description: ceil(totalItems / size). 결과가 없으면 0.
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
      description: |-
        submittedAt 내림차순, 동률이면 신청 id 내림차순으로 정렬합니다.

        - 결과가 없거나 마지막 페이지를 넘기면 items는 빈 배열입니다.
        - 승인 상태 필터와 totalItems는 조회 시점의 DB 상태를 반영합니다.
        - 조회 간 신청 추가·승인으로 결과가 바뀔 수 있으며 스냅샷 페이지는 아닙니다.
    StoreApprovalApproveRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/AdminPassword'
      required:
      - password
    StoreApprovalResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 매장 승인 신청 ID
        applicant:
          $ref: '#/components/schemas/StoreApprovalApplicant'
        store:
          $ref: '#/components/schemas/StoreApprovalStore'
        status:
          type: string
          const: APPROVED
        submittedAt:
          type: string
          format: date-time
          description: 최초 신청 시각. UTC/RFC 3339.
        approvedAt:
          type: string
          format: date-time
          description: 최초 승인 시각. 재승인 요청에서도 변경하지 않음.
      required:
      - id
      - applicant
      - store
      - status
      - submittedAt
      - approvedAt
      description: 승인이 완료된 신청. 최초 승인과 재승인 요청 모두 같은 신청·상태·최초 승인 시각을 반환합니다.
    WorkerProfile:
