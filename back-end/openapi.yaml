      operationId: cancelStoreInvitation
      summary: 수락 대기 초대 취소
      description: |-
        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
