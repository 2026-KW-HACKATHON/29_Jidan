        기존 token accept/decline와 동일 초대 잠금·상태 전이·REGULAR 접근 생성·알림 outbox를 사용합니다. 현재 검증 이메일이 일치하는 PENDING에만 허용하며 expiresAt과 같은 시각부터 INVITATION_EXPIRED입니다. 수락은 접근 종료까지 유효해야 하고, 기존 유효 REGULAR 접근이 있으면 기존 접근을 반환하여 중복 생성하지 않습니다. 취소/재전송/수락 경합은 첫 성공만 처리합니다. REGULAR 접근의 기간은 초대 accessExpiresAt 그대로입니다. 같은 key 재시도 외 이미 처리한 초대는 409입니다. 기존 이메일 링크 API도 계속 사용합니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
