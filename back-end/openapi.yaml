        tab=PENDING은 APPLIED/REQUESTED, CONFIRMED는 미래/진행 중 확정, ENDED는 WITHDRAWN/NOT_SELECTED/COMPLETED입니다. confirmed 근무 종료 시 COMPLETED로 투영합니다. counts는 필터와 페이지와 무관한 세 탭 전체 건수이고 동일 asOf 시점입니다. 최신 지원순(submittedAt DESC,id DESC), 빈 목록은 200입니다. REQUESTED는 신청 중 탭에 표시합니다.

