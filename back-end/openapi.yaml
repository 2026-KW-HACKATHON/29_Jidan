              example:
                code: VALIDATION_ERROR
                message: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '409':
          description: WORK_REQUEST_PENDING, JOB_NOT_RECRUITING, JOB_FILLED, APPLICATION_NOT_ACTIVE, JOB_REVISION_CONFLICT.
          content:
            application/json:
              schema:
