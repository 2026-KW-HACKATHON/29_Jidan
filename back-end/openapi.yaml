  /api/stores/{storeId}/manual/interviews/{sessionId}/completion:
    post:
      tags:
      - 점주 AI 인터뷰
      operationId: generateManualDraft
      summary: 인터뷰 완료·매뉴얼 초안 생성 요청
      description: |-
        **최종 검토 화면 진입과 생성 snapshot**

        - 프론트는 모든 인텐트 진행 후 최종 검토 화면으로 진입할 때 completion을 호출합니다. 별도 생성 버튼이나 요약별 확인 완료는 필요하지 않습니다. 마지막 요약 화면을 표시하는 경우 네, 맞아요 동작에서 호출할 수 있지만 confirmations 호출은 필수 조건이 아닙니다.
        - GET reviews의 sessionRevision을 expectedRevision으로, 전체 항목의 intentId/revision을 reviewRevisions로 제출합니다. 정확히 모든 완료 인텐트를 한 번씩 포함해야 합니다. 중복 intentId·누락은 422 VALIDATION_ERROR, 다른 세션 ID는 404, 오래된 검토/세션 revision은 409 REVISION_CONFLICT입니다.
        - 모든 검토가 READY여야 합니다. PROCESSING 또는 ERROR이면 409 REVIEW_NOT_READY이며 대상 검토를 조회·재시도합니다. confirmedAt=null과 NEEDS_DETAIL도 생성 가능합니다. 확인 동의 없이 요약 생성 작업의 완료만 기다립니다.
        - 모든 review revision·참조 무결성 검증과 GENERATING 전환·생성 입력 snapshot·작업 예약을 같은 트랜잭션으로 처리합니다. 정정이 먼저 접수되면 생성은 거절하고, 생성이 먼저 접수되면 이후 정정·사진·확인·재시도는 409입니다. 일부 변경만 반영하지 않습니다. 서로 다른 검토 간 shift/section 참조 불일치는 409 MANUAL_REFERENCE_CONFLICT입니다.
        - 생성 결과는 snapshot의 근무조·섹션 ID와 사진 이름·설명·순서를 보존하고 미확정 정보와 issues를 함께 만듭니다. 재시도도 같은 snapshot을 사용합니다. 생성 완료 후에는 최종 초안 편집 API로 수정합니다.

        **미확정 정보와 점주 확인**

        - 근무 시간이 불명확하면 해당 startTime/endTime/endsNextDay를 null로 유지합니다. 근무조나 업무 자체가 미확정이면 shifts/sections를 빈 배열로, 절차가 미확정이면 해당 steps를 빈 배열로 표현합니다. AI는 임의의 시간·업무를 만들어 채우지 않습니다.
        - 모든 null 필드·빈 필수 배열은 missingInformation에 정확히 대응해야 합니다. MANUAL 대상의 shifts/sections는 targetId=null, SHIFT의 시간 필드는 해당 shift ID, SECTION의 steps는 해당 section ID를 지정합니다. 완성된 값에 대한 항목·다른 대상·중복 대상 필드는 422 VALIDATION_ERROR입니다. 교차 참조와 누락 대응은 서버 검증 사항입니다.
        - missingInformation.id와 같은 ID의 부족 항목 issue를 서버가 만들고 OPEN으로 유지합니다. 인터뷰 유래는 원래 intentId, 편집으로 새로 생긴 미확정 필드는 intentId=null입니다. 클라이언트는 issues나 확인 상태를 편집하지 못합니다.
        - 내용 수정 시 미확정 대상과 issue를 원자적으로 동기화하고 확인을 초기화합니다. 값이 채워진 항목의 현재 missingInformation과 연결 issue는 함께 제거하되 원래 평가와 확인 이력은 보존합니다. 같은 ID를 다른 대상으로 재사용할 수 없습니다.
        - 시간 길이 검사는 필요한 시간 값이 모두 확정된 근무조에 적용합니다. 부족 항목에 대한 점주 확인은 null/빈 배열을 임의의 확정값으로 변경하지 않습니다.

        READY_TO_GENERATE에서만 실행합니다. 고정 질문 셋의 모든 필수 인텐트에 finishedAt이 있어야 합니다. 충분 판단의 COVERED와 상한에서 검수중으로 넘긴 NEEDS_DETAIL 모두 검토 확인 없이 생성할 수 있습니다. 중간 점주 확인을 기다리지 않습니다. 미진행/PENDING 항목이 있으면 409 INTERVIEW_INCOMPLETE입니다.

        - 같은 초안 versionId에 구조화 작업을 예약하고 세션 GENERATING 및 초안 RUNNING으로 전환합니다. 같은 매장에서 동시에 별도 생성 작업을 만들지 않습니다.
        - 점주 답변·정정·확인 내용과 파일 참조만 매뉴얼의 사실 근거로 사용합니다. 다른 매장 절차·추측을 사실로 채우지 않습니다. 빠진 내용은 issues에 표시합니다.
        - 작업이 완료되면 초안 content와 issues, generationStatus=READY, 세션 COMPLETED를 원자적으로 저장합니다. completedAt은 성공 시에만 기록합니다. 초안은 자동 발행되지 않습니다.
        - 오류는 세션 ERROR 및 초안 ERROR로 표시하고 질문·답변·설정/입력 snapshot을 유지합니다. retries API로 같은 실패 작업을 재개합니다.
        - GET 세션과 GET 초안으로 상태를 확인합니다. 생성 중에는 편집/발행 요청을 409로 거절하여 늦은 AI 결과가 점주 편집을 덮어쓰지 않게 합니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.

        **변경 요청**

        - 회원 세션과 `/api/auth/csrf`에서 받은 `X-CSRF-Token`을 함께 보냅니다.
        - 허용 Origin의 scheme/host/port를 정확히 검증합니다. Origin 또는 토큰 누락·불일치는 **403 CSRF_INVALID**입니다.
        - 권한 확인 후 요청을 검증하고 같은 트랜잭션으로 저장합니다. 실패 시 전체 rollback합니다.
        - 잘못된 JSON은 **400 INVALID_REQUEST**, 필드/UUID/페이지 형식 오류는 **422 VALIDATION_ERROR**입니다.
        - 동시 요청의 상태 전이는 잠금 또는 조건부 갱신으로 한 번만 반영합니다.

        **동시 수정과 재전송**

        - 변경 요청의 `expectedRevision`은 해당 세션 또는 초안의 현재 revision과 같아야 합니다. 불일치는 **409 REVISION_CONFLICT**이며 최신 GET 결과로 다시 검토합니다.
        - UUID `Idempotency-Key`는 주체·매장·endpoint·정규화 body(파일은 byte hash)로 24시간 보관합니다. 현재 권한을 확인한 후 같은 요청은 최초 결과를 재현하고 revision을 다시 올리지 않습니다.
        - 같은 key의 다른 요청은 **409 IDEMPOTENCY_KEY_REUSED**입니다. 신규 요청만 revision을 검사하며 key 재현은 당시 스냅샷일 수 있습니다.
        - 상태 갱신·작업 예약·outbox 저장은 원자적입니다. 예약 실패는 **503 JOB_QUEUE_UNAVAILABLE**이며 변경을 rollback합니다. AI/전사 실행 실패는 조회 응답의 ERROR 상태로 안내합니다.
        - 워커 작업은 입력 revision과 작업 ID를 확인해 성공 결과를 한 번만 적용합니다. 오래된 작업 결과는 현재 상태를 덮어쓰지 않습니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '401':
          description: '세션 없음·만료·폐기: SESSION_EXPIRED. 가입 세션만 존재: REGISTRATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SESSION_EXPIRED
                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '다른 역할: FORBIDDEN. 정지 계정: ACCOUNT_SUSPENDED. 승인 대기: STORE_APPROVAL_REQUIRED. CSRF/Origin 오류:
            CSRF_INVALID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 이 기능을 사용할 권한이 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 입력한 정보를 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 서버 처리 실패. 모든 변경을 rollback합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 처리에 실패했습니다.
                requestId: req_profile_001
                fieldErrors: []
        '404':
          description: '다른 점주/없는 매장: STORE_NOT_FOUND. 매장에 속하지 않는 초안/세션/파일: MANUAL_RESOURCE_NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MANUAL_RESOURCE_NOT_FOUND
                message: 매뉴얼 리소스를 찾을 수 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '400':
          description: 잘못된 JSON 요청.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: JSON 요청 형식을 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '409':
          description: 'REVISION_CONFLICT / IDEMPOTENCY_KEY_REUSED / MANUAL_STATE_CONFLICT / INTERVIEW_STATE_CONFLICT.
            최신 조회 후 현재 상태에 맞게 요청합니다. REVIEW_NOT_READY, MANUAL_REFERENCE_CONFLICT, REVISION_CONFLICT: 생성 준비 또는 snapshot
            충돌.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REVISION_CONFLICT
                message: 최신 내용을 다시 확인해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '503':
          description: 작업 예약 또는 저장소 실패. 변경 전체 rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: JOB_QUEUE_UNAVAILABLE
                message: 잠시 후 다시 시도해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '202':
          description: 작업 접수. 완료 여부는 GET 상태로 확인합니다.
          content:
