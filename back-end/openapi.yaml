          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
          writeOnly: true
          description: 256bit 이상 불투명 base64url 토큰. 메일의 frontend fragment에서 읽어 body로만 전송합니다. 예시는 실제 토큰이 아닙니다.
