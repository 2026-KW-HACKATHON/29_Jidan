      - expiresAt
      - accessType
      - accessExpiresAt
    StoreAccessGrant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - REGULAR
          - TEMPORARY
        dutyLabel:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 300
          pattern: \S
          description: 초대 화면에는 담당 업무 입력이 없어 정기 근무는 null 가능. 대타는 후속 확정 공고의 업무를 조회합니다.
        startedAt:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
          description: 자료 접근 종료 시각(종료 제외). 정기 초대는 선택 기한 또는 null, 대타는 확정 근무 종료 시각.
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRING
          - EXPIRED
          - REVOKED
        permissions:
          type: array
          items:
            type: string
            enum:
            - READ_MANUALS
            - READ_CHECKLISTS
            - USE_AI_QA
          uniqueItems: true
      required:
      - id
      - type
      - dutyLabel
      - startedAt
      - validUntil
      - revokedAt
      - status
      - permissions
      oneOf:
      - type: object
        properties:
          type:
            const: REGULAR
          status:
            const: ACTIVE
          revokedAt:
            type: 'null'
          permissions:
            minItems: 3
            maxItems: 3
        required:
        - type
        - status
        - revokedAt
        - permissions
      - type: object
        properties:
          type:
            const: REGULAR
          status:
            const: EXPIRING
          revokedAt:
            type: 'null'
          permissions:
            minItems: 3
            maxItems: 3
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      - type: object
        properties:
          type:
            const: REGULAR
          status:
            const: EXPIRED
          revokedAt:
            type: 'null'
          permissions:
            minItems: 0
            maxItems: 0
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      - type: object
        properties:
          type:
            const: REGULAR
          status:
            const: REVOKED
          revokedAt:
            type: string
          permissions:
            minItems: 0
            maxItems: 0
        required:
        - type
        - status
        - revokedAt
        - permissions
      - type: object
        properties:
          type:
            const: TEMPORARY
          status:
            const: ACTIVE
          revokedAt:
            type: 'null'
          permissions:
            minItems: 3
            maxItems: 3
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      - type: object
        properties:
          type:
            const: TEMPORARY
          status:
            const: EXPIRING
          revokedAt:
            type: 'null'
          permissions:
            minItems: 3
            maxItems: 3
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      - type: object
        properties:
          type:
            const: TEMPORARY
          status:
            const: EXPIRED
          revokedAt:
            type: 'null'
          permissions:
            minItems: 0
            maxItems: 0
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      - type: object
        properties:
          type:
            const: TEMPORARY
          status:
            const: REVOKED
          revokedAt:
            type: string
          permissions:
            minItems: 0
            maxItems: 0
          validUntil:
            type: string
        required:
        - type
        - status
        - revokedAt
        - permissions
        - validUntil
      description: 매장 자료에 대한 개별 접근 권한. REGULAR는 초대 수락, TEMPORARY는 후속 대타 확정에서 생성합니다. 기간은 [startedAt, validUntil)이며 revokedAt이
        있으면 REVOKED가 우선입니다. EXPIRING은 종료까지 24시간 이내인 유효 권한으로 설계 제안입니다. 서버가 매 요청 실제 시간·매장 승인·계정 상태를 확인합니다.
    StoreInvitationAcceptance:
