        experienceLevel:
          type: string
          enum:
          - NEW
          - EXPERIENCED
          example: NEW
        careers:
          type: array
          items:
            $ref: '#/components/schemas/Career'
          maxItems: 20
      required:
      - experienceLevel
      - careers
      oneOf:
      - properties:
          experienceLevel:
            const: NEW
          careers:
            maxItems: 0
        required:
        - experienceLevel
        - careers
        type: object
      - properties:
          experienceLevel:
            const: EXPERIENCED
          careers:
            minItems: 1
        required:
        - experienceLevel
        - careers
        type: object
      description: 근무 정보 전체 교체. 신입은 NEW와 빈 careers, 경력은 EXPERIENCED와 최소 1건을 함께 보냅니다. 최대 20건은 가입 계약을 따른 설계 제안입니다.
    WorkerAvailabilitiesReplaceRequest:
