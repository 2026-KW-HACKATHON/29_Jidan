        카메라/마이크 입력에 사용하는 multipart 업로드입니다. 사진 최대 10MiB JPEG/PNG/WebP, 음성 최대 20MiB MPEG/MP4/WebM/WAV·2분입니다. 확장자가 아닌 파일 magic bytes/실제 길이/디코딩 결과를 검증합니다. 질문 사진은 업로드 후 7일, 음성은 24시간 보관(제안 정책)하며 만료 후 410 QA_MEDIA_EXPIRED입니다. 미리 서명된 URL/object key/공개 URL은 반환하지 않습니다. 파일은 대화 본인이 동일 매장에만 연결할 수 있습니다. 실패 시 파일/메타데이터를 함께 제거하고 해시·purpose를 Idempotency-Key 본문 비교에 포함합니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

