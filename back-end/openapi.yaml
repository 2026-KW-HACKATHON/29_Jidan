  /api/stores/{storeId}/manual/interviews/{sessionId}:
    get:
      tags:
      - 점주 AI 인터뷰
      operationId: getManualInterview
      summary: 인터뷰 진행·질문·이해 확인 상태 조회
      description: |-
        현재 질문 묶음, 답변 여부, 인텐트별 수집 상태, 이해 확인 내용, 비동기 처리/오류를 반환합니다. 2초 간격 polling과 429 Retry-After를 따릅니다. 새로고침 후 현재 위치로 재개할 수 있습니다.

        **진행 규칙**

        - 기본 질문 depth=0, 새 추가 질문 묶음마다 depth+1, 최대 5입니다. 묶음의 질문 수는 가변이며 전부 답변한 뒤 평가합니다. 공개 묶음 상한 20은 설계 제안입니다.
        - Jev는 누적 질문·답변의 정보 충분성을 판단하고 질문 문구 생성은 별도 작업입니다. 충분성 판단과 생성 실패를 같은 판단 결과로 취급하지 않습니다.
        - 5차 묶음 답변 후에도 부족하면 NEEDS_DETAIL을 유지하고 이해 확인 화면으로 이동합니다. 점주가 확인하면 다음 인텐트로 진행합니다.
        - 사용자 결정: 부족 항목은 최종 검토에 표시하며, 점주 확인만으로 발행할 수 있습니다. 추가 보완 답변은 필수가 아닙니다. 확인이 정보 충분성 판단을 COVERED로 바꾸지 않습니다.
        - 인터뷰 답변·평가 입력·사용 설정 버전은 불변 이력입니다. provider별 내부 응답/원문 오류/prompt는 공개하지 않습니다.
        - 자동 재시도 → fallback까지 실패하면 ERROR로 정지하고 질문·답변·현재 인텐트/depth를 보존합니다. API 요청의 성공과 AI 실행 성공은 별개입니다.

        **회원 인증과 리소스 권한**

        - 가입 완료된 ACTIVE `OWNER`의 회원 세션이 필요합니다. 가입 세션만 있으면 **401 REGISTRATION_REQUIRED**입니다.
        - 대상 회원은 세션에서 결정하며 body의 `password`나 역할/점주 ID를 인증에 사용하지 않습니다.
        - 다른 역할은 **403 FORBIDDEN**, 정지 계정은 **403 ACCOUNT_SUSPENDED**입니다.
        - 세션/역할 확인 후 매장 소유권을 서버에서 확인합니다. 없는 매장과 다른 점주의 매장은 같은 **404 STORE_NOT_FOUND**로 처리합니다.
        - 응답의 `permissions`는 UI 힌트이며 매 요청 현재 DB의 소유권·승인 상태를 확인합니다.
        - 응답에는 `Cache-Control: no-store`를 적용합니다.

        **운영 승인 조건**

        - 이 기능은 해당 점주의 `APPROVED` 매장만 사용할 수 있습니다.
        - 본인의 승인 대기 매장은 **403 STORE_APPROVAL_REQUIRED**입니다.
        - 승인 대기 매장 목록/상세 조회와 새 매장 추가 신청은 허용합니다.
      security:
      - SessionCookie: []
      responses:
        '401':
          description: '세션 없음·만료·폐기: SESSION_EXPIRED. 가입 세션만 존재: REGISTRATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SESSION_EXPIRED
                message: Google 로그인부터 다시 시작해 주세요.
                requestId: req_profile_001
                fieldErrors: []
        '403':
          description: '다른 역할: FORBIDDEN. 정지 계정: ACCOUNT_SUSPENDED. 승인 대기: STORE_APPROVAL_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 이 기능을 사용할 권한이 없습니다.
                requestId: req_profile_001
                fieldErrors: []
        '422':
          description: 필드·UUID·페이지 또는 업무 규칙 검증 실패. fieldErrors로 필드를 안내합니다.
          content:
