  /api/stores/{storeId}/manual/qa/transcriptions/{transcriptionId}/retries:
    post:
      tags:
      - AI 질문 미디어
      operationId: retryQAQuestionTranscription
      summary: 질문 음성 전사 실패 재시도
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다. 선택 매장의 현재 유효 USE_AI_QA 자료 접근과 APPROVED를 매 요청 검증합니다. 소유 대화·업로드 파일은 본인+매장에 귀속되며 접근 종료/수동 종료/다른 매장은 동일 404입니다. 초안·인터뷰 대화·점주 음성에는 접근할 수 없습니다.

        ERROR 작업만 같은 transcriptionId로 RUNNING에 전환합니다. 입력 음성이 아직 본인 소유·유효해야 하며 만료면 410입니다. 같은 key는 같은 작업 결과, 진행/완료는 409 TRANSCRIPTION_NOT_RETRYABLE입니다.

        응답은 Cache-Control: no-store이며 개인정보·토큰·음성 원문을 로그에 남기지 않습니다.

        변경은 SessionCookie + X-CSRF-Token 및 허용 Origin의 정확한 scheme/host/port 검증이 필요합니다. 누락/불일치는 403 CSRF_INVALID입니다. Idempotency-Key(UUID)를 회원 주체·endpoint·정규화 body 기준 24시간 기록하며 동일 요청은 최초 결과를 재현하고 다른 본문 재사용은 409 IDEMPOTENCY_KEY_REUSED입니다. 재현 시에도 현재 역할·매장 접근을 재검증합니다.
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: storeId
        in: path
        required: true
        description: 'storeId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: transcriptionId
        in: path
        required: true
        description: 'transcriptionId: URL 상위 리소스와의 귀속 및 현재 주체의 권한을 검증합니다.'
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 같은 논리 요청의 재시도에는 동일 UUID를 사용합니다.
        schema:
          type: string
          format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 역할·계정·매장 승인·CSRF/Origin·현재 접근 권한 실패.
                requestId: req_chapter_100
                fieldErrors: []
        '404':
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESOURCE_NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                requestId: req_chapter_100
                fieldErrors: []
        '422':
          description: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: 필드·날짜·시간·쿼리·리소스 귀속 검증 실패. fieldErrors로 안내합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: 일시 처리 실패. 저장·상태 전이를 원자적으로 롤백합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '503':
          description: 작업 예약 일시 장애. 변경 전체 rollback, 같은 Idempotency-Key로 재시도 가능.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: JOB_QUEUE_UNAVAILABLE
                message: 잠시 후 다시 시도해 주세요.
                requestId: req_chapter_100
                fieldErrors: []
        '409':
          description: 현재 상태·revision 또는 Idempotency-Key가 충돌합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STATE_CONFLICT
                message: 현재 상태·revision 또는 Idempotency-Key가 충돌합니다.
                requestId: req_chapter_100
                fieldErrors: []
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualTranscription'
              example:
                id: 7390d3c1-dc0d-4b1c-814d-b68a1df5c1b6
                mediaId: 15a9721b-2e65-4d03-8fd0-a5999e19d27a
                status: RUNNING
                text: null
                error: null
                createdAt: '2026-10-05T01:00:00Z'
                completedAt: null
        '410':
          description: 음성 보관 기한이 끝났습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: QA_MEDIA_EXPIRED
                message: 음성 보관 기한이 끝났습니다.
                requestId: req_chapter_100
                fieldErrors: []
      externalDocs:
        description: 기준 Figma 화면
        url: https://www.figma.com/design/ZaFHresnBXJ1h98Xl1AUDj?node-id=330-2914
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAProcessingRetry'
            example: {}
