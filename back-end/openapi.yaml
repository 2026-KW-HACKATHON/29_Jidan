      properties:
        workerId:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/Name'
        storeId:
          type: string
          format: uuid
        accessStatus:
          type: string
          enum:
          - ACTIVE
          - EXPIRING
          - ENDED
        accessGrants:
          type: array
          items:
            $ref: '#/components/schemas/StoreAccessGrant'
          minItems: 1
        permissions:
          type: array
          items:
            type: string
            enum:
            - READ_MANUALS
            - READ_CHECKLISTS
            - USE_AI_QA
          uniqueItems: true
        asOf:
          type: string
          format: date-time
      required:
      - workerId
      - name
      - storeId
      - accessStatus
      - accessGrants
      - permissions
      - asOf
      oneOf:
      - type: object
        properties:
          accessStatus:
            const: ACTIVE
          accessGrants:
            contains:
              type: object
              properties:
                status:
                  const: ACTIVE
              required:
              - status
          permissions:
            minItems: 3
            maxItems: 3
        required:
        - accessStatus
        - accessGrants
        - permissions
      - type: object
        properties:
          accessStatus:
            const: EXPIRING
          accessGrants:
            contains:
              type: object
              properties:
                status:
                  const: EXPIRING
              required:
              - status
            items:
              type: object
              properties:
                status:
                  enum:
                  - EXPIRING
                  - EXPIRED
                  - REVOKED
              required:
              - status
          permissions:
            minItems: 3
            maxItems: 3
        required:
        - accessStatus
        - accessGrants
        - permissions
      - type: object
        properties:
          accessStatus:
            const: ENDED
          accessGrants:
            items:
              type: object
              properties:
                status:
                  enum:
                  - EXPIRED
                  - REVOKED
              required:
              - status
          permissions:
            maxItems: 0
        required:
        - accessStatus
        - accessGrants
        - permissions
      description: 해당 매장에 자료 접근 이력이 있는 근무자 1명. 여러 초대/대타 접근을 가진 경우도 한 항목으로 묶습니다. Google 이메일·연락처·생일·가입 경력은 노출하지 않습니다.
        현재 유효 접근 중 하나라도 ACTIVE면 ACTIVE, 유효 접근이 모두 EXPIRING이면 EXPIRING, 유효 접근이 없으면 ENDED입니다.
    StoreWorkerAccessPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreWorkerAccess'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        asOf:
          type: string
          format: date-time
        activeCount:
          type: integer
          minimum: 0
          description: 유효 접근이 있는 서로 다른 근무자 수. EXPIRING 포함.
        expiringCount:
          type: integer
          minimum: 0
          description: 모든 유효 접근의 마지막 종료가 24시간 이내인 근무자 수. activeCount의 부분집합.
        endedCount:
