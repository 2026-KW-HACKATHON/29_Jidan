        고정 최신순(createdAt DESC,id DESC)입니다. 필터는 AND이며 결과 없음은 200 items=[]입니다. 지원자 수는 개인정보 없는 현재 유효 지원 수입니다. 날짜 범위·시간대 해석은 화면에 없는 설계 제안입니다.

