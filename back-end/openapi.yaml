  /api/stores/{storeId}/manual/published:
    get:
      tags:
      - 근무자 매뉴얼
      operationId: getPublishedManual
      summary: 게시된 매뉴얼 업무 목록·근무조 조회
      description: |-
        AI 답변 근거/목록에서 받은 expectedVersionId를 보낼 수 있습니다. 현재 게시본과 다르면 409 MANUAL_VERSION_CHANGED이며 최신 매뉴얼을 다시 조회하도록 안내합니다. 예전 답변을 새 매뉴얼의 동명 섹션에 잘못 연결하지 않습니다.

        공개 missingInformation을 반환해 미확정 내용을 숨기지 않습니다. 목록은 전체 게시본의 항목을, 상세는 해당 섹션과 참조 근무조의 항목만 반환합니다. 내부 issue/평가/점주 메모는 반환하지 않습니다. 빈 목록과 절차 미확정은 missingInformation으로 구별합니다.

        현재 게시본의 근무 구조와 업무 목록을 반환합니다. sections는 content 순서를 유지하고 단계/사진 건수를 제공합니다. filter=SHIFT는 선택 근무조 업무와 모든 조의 공통 업무·규정·설비를 함께 표시합니다. 해당 조에 별도 업무가 없거나 필터 결과가 비면 200 sections=[]입니다.

        filter/shiftId 조합과 해당 게시 버전 참조를 확인합니다. worker의 실제 근무조 자동 판정은 하지 않으며 모든 근무조의 승인된 매뉴얼을 열람할 수 있습니다. 각 요청은 한 스냅샷의 currentPublishedVersionId에 고정해 버전이 섞이지 않게 합니다.

        ACTIVE OWNER의 소유 매장 열람도 허용하며, WORKER에는 아래 현재 자료 접근 조건을 적용합니다. OWNER의 소유권 실패도 같은 404 STORE_NOT_FOUND입니다. 게시본이 없는 경우에는 권한을 먼저 확인한 뒤 404 MANUAL_NOT_PUBLISHED입니다.

        **열람 권한**

        - 가입 완료된 ACTIVE WORKER 세션과 이 매장의 현재 유효한 `READ_MANUALS` 접근이 필요합니다.
        - 정기/대타 중 하나라도 시작 시각 이상이고 만료 시각 미만이며 수동 종료되지 않았으면 허용합니다. 현재 시각이 종료 시각과 같아도 차단합니다.
        - 요청마다 회원 상태·APPROVED·유효 접근을 확인합니다. 다른 역할/정지는 403, 매장 승인 중단은 403 STORE_APPROVAL_REQUIRED입니다.
        - 존재하지 않는 매장과 접근 권한 없는 매장은 같은 **404 STORE_NOT_FOUND**입니다. 요청한 섹션/사진은 현재 게시 버전에 속해야 합니다.
        - 게시 전 초안·점주 대화·평가·비공개 음성은 반환하지 않습니다. 응답은 Cache-Control: no-store입니다.
