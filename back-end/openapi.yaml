        properties:
          category:
            const: SHIFT_TASK
          shiftId:
            type: string
            format: uuid
        required:
        - category
        - shiftId
      - type: object
        properties:
          category:
            enum:
            - COMMON_TASK
            - RULE
            - EQUIPMENT
          shiftId:
            type: 'null'
        required:
        - category
        - shiftId
    ManualContent:
