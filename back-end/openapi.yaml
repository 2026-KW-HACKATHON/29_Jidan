              examples:
                worker:
                  summary: 가입을 완료한 일반회원
                  value:
                    user:
                      id: a7be5b17-30d8-4b47-bd75-e866b4539dc9
                      role: WORKER
                      name: 김지수
                      identity:
                        provider: GOOGLE
                        email: member@example.com
                        emailVerified: true
                      phoneNumber: '01012345678'
                      profileCompleted: true
                      permissions:
                      - BROWSE_JOB_POSTINGS
                      - APPLY_FOR_JOBS
                      - READ_OWN_PROFILE
                      stores: []
                    expiresAt: '2026-10-03T10:00:00Z'
                    nextAction: WORKER_HOME
                pendingOwner:
                  summary: 매장 운영 승인 대기 점주
                  value:
                    user:
                      id: 24b9e7af-90fd-424b-9eb3-0b65cda88b2f
                      role: OWNER
                      name: 김민수
                      identity:
                        provider: GOOGLE
                        email: owner@example.com
                        emailVerified: true
                      phoneNumber: '01012345678'
                      profileCompleted: true
                      permissions:
                      - READ_OWN_STORE_STATUS
                      stores:
                      - storeId: 51c1c743-d377-4e7a-8449-94377eecfce0
                        storeName: 명랑핫도그 광운대점
                        approvalStatus: PENDING
                        permissions:
                        - READ_STORE_STATUS
                    expiresAt: '2026-10-03T10:00:00Z'
                    nextAction: OWNER_APPROVAL_PENDING
        '401':
