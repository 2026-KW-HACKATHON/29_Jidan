  /api/users/me/home:
    get:
      tags:
      - 홈 요약
      operationId: getWorkerHome
      summary: 일반회원 홈 활동·추천 공고 요약
      description: |-
        ACTIVE WORKER 세션이 필요합니다. 다른 역할/정지 계정은 403입니다. 본인이 아닌 리소스와 없는 리소스는 동일 404 RESOURCE_NOT_FOUND입니다.

        나의 활동의 신청 중(APPLIED/REQUESTED), 승인된 관심 매장, 현재 정기 자료 접근이 있는 서로 다른 매장 수와 안 읽음 알림 수를 같은 asOf로 반환합니다. 정기 근무 매장 수는 현재 정기 자료 접근이 있는 매장 건수이며 달력 일정 건수가 아닙니다.

        사용자 확정 추천 순서: 시간이 맞는 공고 우선, 그 안에서 근무일 가까운 순입니다. 월계1동 APPROVED 매장의 시작 전 RECRUITING·미확정·현재 유효 본인 지원이 없는 공고가 후보입니다. 과거 WITHDRAWN 이력만 있으면 재지원 가능하므로 후보에 포함합니다. 최대 3개, 빈 결과는 recommendedJobs=[]입니다. 최소 경력은 기존 안내 조건이며 시간 일치나 추천 후보를 자동 차단하지 않습니다.

        시간 일치는 등록된 주간 Availability를 Asia/Seoul 실제 날짜 구간으로 확장하여 합집합이 근무 [startAt,endAt) 전체를 덮는지 판단합니다. 전체를 덮으면 matchesAvailability=true, 일부만 겹치거나 등록 시간이 없으면 false입니다. 전날 시작한 심야 가능 시간과 SUN→MON도 포함하고 끝에만 닿는 구간은 겹침이 아닙니다. 인접 가능 시간은 합쳐 전체 근무를 덮을 수 있으며 중첩은 중복 계산하지 않습니다.

        matchesAvailability DESC → startAt ASC → id ASC로 정렬합니다. 시간 불일치 공고는 일치 후보 뒤에 표시하며 같은 일치 여부 안에서는 날짜/시각 가까운 순입니다. 등록일 최신순이 아닙니다. 서버가 같은 asOf에서 가능 시간·후보 상태·본인 지원·정렬을 평가합니다. 캘린더는 별도 전체 매장 대타 월별 조회 API를 사용합니다.

        응답은 Cache-Control: no-store입니다.
