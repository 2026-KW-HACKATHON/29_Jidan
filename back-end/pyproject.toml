[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mysql: needs a dedicated *_test MySQL database configured through DB_*; skipped otherwise",
    "openai: calls the real OpenAI API; runs only with OPENAI_API_KEY and JIDAN_RUN_OPENAI=1",
]
# A late begin_transition would silently keep REPEATABLE READ in production; fail tests instead.
filterwarnings = ["error::app.jobs.state.LateTransitionWarning"]
