name: 버그 신고
description: 발생한 문제와 재현 방법을 공유합니다.
body:
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      description: 문제가 발생한 영역을 선택합니다.
      multiple: true
      options:
        - 프론트엔드
        - 백엔드
        - 공통
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 및 영향
      description: 발생한 문제와 사용자에게 미치는 영향을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 발생 조건과 재현 순서를 작성합니다. 재현되지 않으면 발생 당시 상황과 빈도를 작성합니다.
      placeholder: "1. 사전 조건을 설정합니다.\n2. 문제를 일으키는 동작을 수행합니다."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작했을 때의 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제 결과와 오류 메시지를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 실행 환경, 버전, 브라우저 또는 API 정보를 작성합니다. 확인할 수 없는 정보는 미확인으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 수정 범위
      description: 예상 수정 범위와 제외 대상을 작성합니다. 원인 분석 전이라면 미확정으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 재현 상황 해소와 회귀 확인 조건을 체크리스트로 작성합니다.
      placeholder: "- [ ] 재현 순서에 따라 실행해도 문제가 발생하지 않습니다."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 관련 이슈, 로그, 스크린샷이 있다면 첨부합니다. 개인정보와 인증 정보는 제거합니다.
