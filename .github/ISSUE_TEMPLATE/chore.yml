name: 문서·설정·유지보수 작업
description: 문서, 설정 및 유지보수 작업을 정의합니다.
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 변경이 필요한 영역을 선택합니다.
      multiple: true
      options:
        - 프론트엔드
        - 백엔드
        - 공통
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 배경 및 목적
      description: 현재 상황과 작업이 필요한 이유를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 변경할 문서, 설정 또는 관리 대상과 제외 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업 완료 여부를 검증할 수 있는 조건을 체크리스트로 작성합니다.
      placeholder: "- [ ] 변경한 설정이나 문서의 적용 결과를 확인합니다."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 및 참고 자료
      description: 적용 시 주의점, 관련 이슈, 문서와 선행 작업이 있다면 작성합니다.
