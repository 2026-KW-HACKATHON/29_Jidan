name: 기능 추가 및 개선 요청
description: 새로운 기능이나 기존 기능의 개선을 제안합니다.
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 변경이 필요한 영역을 선택합니다.
      multiple: true
      options:
        - 프론트엔드
        - 백엔드
        - 공통
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 배경 및 목적
      description: 해결하려는 문제와 필요한 이유를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 구현할 동작과 이번 작업에서 제외할 내용을 구분하여 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 결과를 확인할 수 있는 조건을 체크리스트로 작성합니다. 예외 상황도 포함합니다.
      placeholder: "- [ ] 사용자가 수행할 수 있어야 하는 동작을 작성합니다."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료 및 의존성
      description: 관련 이슈, 디자인, 문서와 선행 작업이 있다면 작성합니다.
