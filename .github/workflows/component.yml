name: Component pipeline

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      source:
        type: string
        required: true
      environment:
        type: string
        required: true
      deploy:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      image: ${{ steps.config.outputs.image }}@${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify deployment logic
        run: |
          bash -n deploy/scripts/deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Verify Nginx callback log privacy
        if: inputs.component == 'backend'
        run: python3 deploy/scripts/verify_nginx.py
      - name: Check application initialization
        id: source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -d "$SOURCE" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Application directory $SOURCE is not initialized; application build and deployment skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure image
        id: config
        if: steps.source.outputs.ready == 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          preview=false
          if [ "$COMPONENT" = frontend ] && [ "$ENVIRONMENT" = dev ]; then preview=true; fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/2026-kw-hackathon/29_jidan-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Set up hosted builder
        if: steps.source.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test ARM64 image
        if: steps.source.outputs.ready == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.source }}
          file: deploy/${{ inputs.component }}/Dockerfile
          platforms: linux/arm64
          target: test
          outputs: type=cacheonly
          pull: true
          build-args: DOCS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}-test
          cache-to: type=gha,scope=${{ inputs.component }}-test,mode=max
      - name: Log in to GHCR
        if: inputs.deploy && steps.source.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime image
        id: image
        if: steps.source.outputs.ready == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.source }}
          file: deploy/${{ inputs.component }}/Dockerfile
          platforms: linux/arm64
          target: runtime
          push: ${{ inputs.deploy }}
          tags: ${{ steps.config.outputs.image }}:${{ github.sha }}
          build-args: |
            VITE_ENABLE_PREVIEW=${{ steps.config.outputs.preview }}
            DOCS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}-runtime-${{ inputs.environment }}
          cache-to: type=gha,scope=${{ inputs.component }}-runtime-${{ inputs.environment }},mode=max

  deploy:
    needs: build
    if: inputs.deploy && needs.build.outputs.ready == 'true'
    runs-on: [self-hosted, Linux, ARM64, jidan, deploy, rpi5]
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    # Keep frontend and backend pending deployments from replacing each other.
    concurrency:
      group: jidan-deploy-${{ inputs.environment }}-${{ inputs.component }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Deploy exact image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-${{ github.run_id }}-${{ inputs.component }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./deploy/scripts/deploy.sh "$ENVIRONMENT" "$COMPONENT" "$IMAGE"
