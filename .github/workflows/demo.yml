name: Demo CI/CD
on:
  push:
    branches: [demo/main, demo/front-end/dev, demo/back-end/dev]
  pull_request:
    branches: [demo/main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jidan-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    outputs:
      image: ghcr.io/2026-kw-hackathon/29_jidan-demo-frontend@${{ steps.image.outputs.digest }}
      ready: ${{ steps.source.outputs.demo }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: Detect frontend
        id: source
        run: |
          if test -f front-end/package.json; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
          if test -f front-end/src/demo/DemoApp.tsx; then echo 'demo=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.source.outputs.present == 'true'
        with: {node-version: '22', cache: npm, cache-dependency-path: front-end/package-lock.json}
      - name: Frontend checks
        if: steps.source.outputs.present == 'true'
        working-directory: front-end
        env: {CI: 'true', VITE_ENABLE_DEMO: 'true'}
        run: npm ci && npm run lint && npm run test:ci && npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.source.outputs.present == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.repository == '2026-KW-HACKATHON/29_Jidan' && github.ref == 'refs/heads/demo/main' && github.event_name != 'pull_request' && steps.source.outputs.demo == 'true'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Frontend runtime image
        id: image
        if: steps.source.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: front-end
          file: deploy/frontend/Dockerfile
          platforms: linux/arm64
          target: runtime
          push: ${{ github.repository == '2026-KW-HACKATHON/29_Jidan' && github.ref == 'refs/heads/demo/main' && github.event_name != 'pull_request' && steps.source.outputs.demo == 'true' }}
          tags: ghcr.io/2026-kw-hackathon/29_jidan-demo-frontend:${{ github.sha }}
          build-args: |
            VITE_ENABLE_DEMO=true
            VITE_ENABLE_PREVIEW=false
          labels: |
            org.opencontainers.image.source=https://github.com/2026-KW-HACKATHON/29_Jidan
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-frontend
          cache-to: type=gha,scope=demo-frontend,mode=max

  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions: {contents: read, packages: write}
    outputs:
      image: ghcr.io/2026-kw-hackathon/29_jidan-demo-backend@${{ steps.image.outputs.digest }}
      ready: ${{ steps.source.outputs.demo }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: demo-ci-root
          MYSQL_DATABASE: jidan_e2e_test
          MYSQL_USER: jidan
          MYSQL_PASSWORD: demo-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="MYSQL_PWD=demo-ci-only mysql -h 127.0.0.1 -u jidan -D jidan_e2e_test -e 'SELECT 1'"
          --health-interval=3s --health-timeout=3s --health-retries=60
    env:
      APP_ENV: local
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: jidan_e2e_test
      DB_USER: jidan
      DB_PASSWORD: demo-ci-only
      JIDAN_REQUIRE_MYSQL: '1'
      AI_PROVIDER: fake
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: Detect backend
        id: source
        run: |
          if test -f back-end/requirements-dev.txt; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
          if test -f back-end/app/demo.py; then echo 'demo=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deployment logic checks
        run: |
          bash -n deploy/demo/deploy.sh
          python3 -m unittest discover -s deploy/tests -p 'test_demo_*.py' -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.source.outputs.present == 'true'
        with: {python-version: '3.12', cache: pip, cache-dependency-path: back-end/requirements-dev.txt}
      - name: Backend static checks
        if: steps.source.outputs.present == 'true'
        working-directory: back-end
        run: python -m pip install -r requirements-dev.txt && python -m ruff check .
      - name: Demo session and real HTTP/MySQL checks
        if: steps.source.outputs.demo == 'true'
        working-directory: back-end
        run: |
          python -m pytest tests/test_public_demo.py tests/test_auth.py -q
          # Unit DB cleanup removes the question-set seed; recreate only this disposable DB.
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m pytest e2e/test_public_demo_http.py e2e/test_public_demo_retention_http.py -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.source.outputs.present == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.repository == '2026-KW-HACKATHON/29_Jidan' && github.ref == 'refs/heads/demo/main' && github.event_name != 'pull_request' && steps.source.outputs.demo == 'true'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Backend runtime image
        id: image
        if: steps.source.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: back-end
          file: deploy/backend/Dockerfile
          platforms: linux/arm64
          target: runtime
          push: ${{ github.repository == '2026-KW-HACKATHON/29_Jidan' && github.ref == 'refs/heads/demo/main' && github.event_name != 'pull_request' && steps.source.outputs.demo == 'true' }}
          tags: ghcr.io/2026-kw-hackathon/29_jidan-demo-backend:${{ github.sha }}
          build-args: DOCS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/2026-KW-HACKATHON/29_Jidan
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-backend
          cache-to: type=gha,scope=demo-backend,mode=max

  deploy:
    needs: [frontend, backend]
    if: github.repository == '2026-KW-HACKATHON/29_Jidan' && github.ref == 'refs/heads/demo/main' && github.event_name != 'pull_request' && needs.frontend.outputs.ready == 'true' && needs.backend.outputs.ready == 'true'
    runs-on: [self-hosted, Linux, ARM64, jidan, build, rpi4]
    timeout-minutes: 20
    permissions: {contents: read, packages: read}
    concurrency: {group: jidan-demo-deploy, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Run Compose on RPi4
        env:
          FRONTEND_IMAGE: ${{ needs.frontend.outputs.image }}
          BACKEND_IMAGE: ${{ needs.backend.outputs.image }}
        run: bash deploy/demo/deploy.sh "$GITHUB_SHA" "$FRONTEND_IMAGE" "$BACKEND_IMAGE"
